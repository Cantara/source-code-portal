# Example configuration. Copy it to scp.yaml (gitignored), set your organisations and the App key or token file, then `make run`.
# Every key can also be set as SCP_<KEY> with dots as underscores, for example SCP_SERVER_PUBLIC_ADDR.
# `scp config check --config <file>` prints the effective settings.
server:
  public_addr: ":9090"
  admin_addr: ":9091"
  shutdown_grace: 20s
  # Absolute base of the public listener: absolute links in /llms.txt and Markdown; https also turns on HSTS.
  public_url: https://scp.example.org
  # CIDRs of reverse proxies whose X-Forwarded-For names the client.
  trusted_proxies: [10.0.0.0/8]
log:
  level: info
  format: text
store:
  path: /data/scp.db
sync:
  concurrency: 4
github:
  sources:
    - id: github
      orgs: [Cantara] # organisations and user accounts
      # A GitHub App (preferred) or a token file; not both.
      app:
        id: 123456
        private_key_file: /run/secrets/scp-app.pem
      # token_file: /run/secrets/github-token
      include_forks: false
      include_archived: true
      include_private: false # true needs access.private_groups and a way to know the viewer: the proxy or auth
catalog:
  reconcile_interval: 5m
  groups:
    - id: core
      name: Core
      description: The portal itself
      default_repo: source-code-portal
      match:
        - prefix: source-code-
    - id: other
      name: Other
      default_repo: whydah
      match:
        - catch_all: true
# GitHub webhook (content type application/json; events push, release, repository, installation, installation_repositories) at
# POST /webhooks/github. The receiver is registered only when secret_file is set; previous_secret_file keeps deliveries signed with
# the old secret valid during a rotation.
webhook:
  secret_file: /run/secrets/webhook-secret
  # previous_secret_file: /run/secrets/webhook-secret-old
# Who sees private repositories: the headers a trusted authenticating proxy sets and the permitted groups.
access:
  user_header: X-Forwarded-User
  groups_header: X-Forwarded-Groups
  private_groups: [] # ["*"] admits every authenticated user
# The portal's own sign-in: single sign-on through an OpenID Connect provider (redirect URI <server.public_url>/auth/callback) and
# access tokens for API clients. A session is a cookie sealed with session_key_file (32 random bytes, the same on every instance).
auth:
  session_key_file: "" # /run/secrets/scp-session-key
  session_ttl: 12h
  admin_emails: [] # verified emails of the administrators
  admin_groups: []
  tokens: [] # [{name: ci, secret_file: /run/secrets/scp-token-ci, groups: [engineering], admin: false}]
  oidc:
    issuer: "" # https://login.example.org
    client_id: ""
    client_secret_file: ""
    scopes: [openid, email, profile]
    groups_claim: groups
# The assistant on /ask: a language model answers questions about the catalogue through read-only tools; an empty provider turns it off.
llm:
  provider: "" # anthropic, openai, gemini, openrouter, ollama
  model: "" # empty: the provider's default (claude-haiku-5-5, gpt-4o, ...)
  base_url: "" # empty: the provider's API
  api_key_file: "" # /run/secrets/scp-llm-key; not needed for ollama
assistant:
  access: signed-in # admin, everyone
  concurrency: 4
  max_turns: 8
  max_tool_calls: 16
  max_tokens: 16000
  max_history: 40
  max_input_chars: 60000
  tool_result_chars: 12000
# Several instances serving one portal through Hazelcast; leave addresses empty for one instance.
cluster:
  addresses: [] # ["hazelcast:5701"]
  name: dev
  namespace: scp
# The web UI: the Next.js server in dir (web/bundle of a build, the scp-web archive of a release) that scp serve runs with node.
# The image sets both (SCP_WEB_DIR=/web, SCP_WEB_NODE=/nodejs/bin/node); without dir the pages answer 503.
web:
  dir: "" # web/bundle
  node: node
ops:
  pprof: false # /debug/pprof/ on the admin listener
