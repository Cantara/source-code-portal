# Example configuration for `scp serve --config deploy/config.example.yaml`.
# Every key can also be set as SCP_<KEY> with dots as underscores, for example SCP_SERVER_PUBLIC_ADDR.
# `scp config check --config <file>` prints the effective settings.
server:
  public_addr: ":9090"
  admin_addr: ":9091"
  shutdown_grace: 20s
log:
  level: info
  format: text
store:
  path: /data/scp.db
sync:
  concurrency: 4
github:
  sources:
    - id: github
      orgs: [Cantara]
      # A GitHub App (preferred) or a token file; not both.
      app:
        id: 123456
        private_key_file: /run/secrets/scp-app.pem
      # token_file: /run/secrets/github-token
      include_forks: false
      include_archived: true
catalog:
  reconcile_interval: 5m
  groups:
    - id: core
      name: Core
      description: The portal itself
      default_repo: source-code-portal
      match:
        - prefix: source-code-
    - id: other
      name: Other
      default_repo: whydah
      match:
        - catch_all: true
