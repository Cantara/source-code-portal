# Example configuration. Copy it to scp.yaml (gitignored), set your organisations and the App key or token file, then `make run`.
# Every key can also be set as SCP_<KEY> with dots as underscores, for example SCP_SERVER_PUBLIC_ADDR.
# `scp config check --config <file>` prints the effective settings.
server:
  public_addr: ":9090"
  admin_addr: ":9091"
  shutdown_grace: 20s
  # Absolute base of the public listener: absolute links in /llms.txt and Markdown; https also turns on HSTS.
  public_url: https://scp.example.org
  # CIDRs of reverse proxies whose X-Forwarded-For names the client.
  trusted_proxies: [10.0.0.0/8]
log:
  level: info
  format: text
store:
  path: /data/scp.db
sync:
  concurrency: 4
github:
  sources:
    - id: github
      orgs: [Cantara]
      # A GitHub App (preferred) or a token file; not both.
      app:
        id: 123456
        private_key_file: /run/secrets/scp-app.pem
      # token_file: /run/secrets/github-token
      include_forks: false
      include_archived: true
catalog:
  reconcile_interval: 5m
  groups:
    - id: core
      name: Core
      description: The portal itself
      default_repo: source-code-portal
      match:
        - prefix: source-code-
    - id: other
      name: Other
      default_repo: whydah
      match:
        - catch_all: true
# GitHub webhook (content type application/json; events push, release, repository, installation, installation_repositories) at
# POST /webhooks/github. The receiver is registered only when secret_file is set; previous_secret_file keeps deliveries signed with
# the old secret valid during a rotation.
webhook:
  secret_file: /run/secrets/webhook-secret
  # previous_secret_file: /run/secrets/webhook-secret-old
ops:
  pprof: false # /debug/pprof/ on the admin listener
