  - {pattern: 'GET /badges/groups/{groupId}/{file}', owner: badges, contentType: image/svg+xml}
  - {pattern: 'GET /media/{repo}/{ref}/{path...}', owner: media}
  - {pattern: 'GET /media/ext/{sig}/{id}', owner: media}
  - {pattern: 'GET /llms.txt', owner: overview, contentType: 'text/plain; charset=utf-8'}
  - {pattern: 'GET /llms-full.txt', owner: overview, contentType: 'text/plain; charset=utf-8'}
  - {pattern: 'GET /groups/{groupId}/llms.txt', owner: overview}
  - {pattern: 'GET /repos/{repo}/llms.txt', owner: overview}
  - {pattern: 'GET /repos/{repo}/readme.md', owner: docs, contentType: 'text/markdown; charset=utf-8'}
  - {pattern: 'GET /repos/{repo}/docs/{path...}', owner: docs, contentType: 'text/markdown; charset=utf-8'}
  - {pattern: 'GET /repos/{repo}/dependencies.md', owner: manifests, contentType: 'text/markdown; charset=utf-8'}
  - {pattern: 'POST /webhooks/github[/{source}]', owner: webhook}
  - {pattern: 'GET /livez, GET /readyz', owner: ops}
  - {pattern: 'GET /sitemap.xml, GET /robots.txt, GET /schemas/scp/{file}', owner: overview}
