  /api/v1/repos/{repo}/docs/{docId}:
    get:
      operationId: getRepoDoc
      summary: One rendered document
      description: |-
        The document as sanitised HTML plus structured metadata. `html` is produced by the single server-side
        pipeline (goldmark, rewrite, chroma, sanitiser; ADR-005) and is the only member that may be inserted as HTML;
        the SPA does so through one component and a Trusted Types policy. It is `null` unless `state` is `resident`
        (a README that does not exist, a document beyond the residency budget, an unsupported or oversized file).
        Relative links and images are already rewritten to portal routes, GitHub blob URLs or `/media/...`; heading ids
        are prefixed `doc-`. `markdownUrl` serves the same content as raw Markdown with `scp:` front matter.
        A `docId` is `readme` or the repository path with `/` replaced by `~` (see `DocId`).
