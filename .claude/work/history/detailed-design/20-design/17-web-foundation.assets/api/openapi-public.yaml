                uiUrl: /pages/about
                apiUrl: /api/v1/pages/about
                html: '<h1 id="doc-about-the-portal">About the portal</h1><p>The portal aggregates GitHub repositories.</p>'
                toc: [{depth: 1, text: About the portal, id: doc-about-the-portal}]
                freshness: *freshPages
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/repos/{repo}/manifests:
    get:
      operationId: getRepoManifests
      summary: Technology and package manifests of a repository
      description: >-
        Summary of what the static parsers found: languages, ecosystems, toolchain facts, the manifest units (a Maven
        module, an npm package, a Go module, a crate) with the files they came from, counts and diagnostics. Parsing is
        static (no build tool is ever executed); facts from heuristic parsers (Gradle scripts, `Package.swift`, `Gemfile`)
        say so in `confidence` and in diagnostics. Every response names the exact tree and blobs it was derived from.
        Disabled with `manifests.enabled: false` (then `404 feature-disabled`). Facts arrive late after a cold start and
        are marked stale until then; they never gate readiness.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.repo
      x-scp-etag: repo-rev
      parameters:
        - $ref: 'common.yaml#/components/parameters/RepoSlug'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Manifest summary.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RepoManifests'}
              example: *repoManifests
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '308': {$ref: 'common.yaml#/components/responses/RepoRenamed'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/repos/{repo}/dependencies:
    get:
      operationId: listRepoDependencies
      summary: Dependencies of a repository
      description: >-
        Declared dependencies (and, with `relationship=transitive|all`, the lockfile-resolved components) of all units of
        the repository, cursor-paged. Internal dependencies (on an artifact produced by another tracked repository) are
        marked with `internal`. The default order is ecosystem, name, unit; `sort` changes the primary key and the
        cursor is only valid for the sort it was issued with.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.deps
      x-scp-etag: snapshot-variant
      parameters:
        - $ref: 'common.yaml#/components/parameters/RepoSlug'
        - name: scope
          in: query
          description: Only these scopes (repeat to union).
          style: form
          explode: true
          schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/DependencyScope'}}
        - name: relationship
          in: query
          description: '`direct` (default) lists declared dependencies, `transitive` the locked components that are not declared, `all` both.'
          schema: {type: string, enum: [direct, transitive, all], default: direct}
        - name: internal
          in: query
          description: '`true` keeps only dependencies on other tracked repositories, `false` only external ones.'
          schema: {type: boolean}
        - name: ecosystem
          in: query
          description: Only these ecosystems (repeat to union).
          style: form
          explode: true
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/EcosystemId'}}
        - name: unit
          in: query
          description: Only one unit of the repository.
          schema: {$ref: '#/components/schemas/UnitId'}
        - $ref: 'common.yaml#/components/parameters/Q'
        - name: sort
          in: query
          schema: {type: string, enum: [name, -name, ecosystem, -ecosystem, scope, -scope], default: ecosystem}
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of dependencies.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
            Link: {$ref: 'common.yaml#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyList'}
              example:
                repo: billing-service
                treeSha: 9fceb02d0ae598e95dc970b74767f19372d61af8
                items: [*depCoreLib, *depGuava]
                page: {nextCursor: null, limit: 50}
                freshness: *freshManifests
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '308': {$ref: 'common.yaml#/components/responses/RepoRenamed'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/repos/{repo}/sbom.cdx.json:
    get:
      operationId: getRepoSbom
      summary: CycloneDX SBOM of a repository
      description: >-
        The repository's components and dependency edges as a CycloneDX 1.7 JSON document (boundary format; the internal
        model is richer). Generated from the parsed facts; locked transitive components are included when a lockfile
        exists. SPDX export is deferred. The body follows the CycloneDX schema, which this document does not restate.
        The ETag is the weak tree-sha tag (process epoch, tree sha, view class).
      tags: [manifests]
      externalDocs: {url: 'https://cyclonedx.org/docs/1.7/json/', description: CycloneDX 1.7 JSON schema}
      x-scp-owner: manifests
      x-scp-route: api.manifests.sbom
      x-scp-etag: tree-sha
      parameters:
        - $ref: 'common.yaml#/components/parameters/RepoSlug'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A CycloneDX document.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/vnd.cyclonedx+json:
              schema: {type: object, additionalProperties: true, required: [bomFormat, specVersion], properties: {bomFormat: {type: string, const: CycloneDX}, specVersion: {type: string, examples: ['1.7']}}}
              example:
                bomFormat: CycloneDX
                specVersion: '1.7'
                version: 1
                metadata: {timestamp: '2026-10-14T09:41:07Z', component: {type: application, name: billing-service, 'bom-ref': 'pkg:maven/org.acme.billing/billing-service@3.4.0-SNAPSHOT'}}
                components: [{type: library, name: core-lib, group: org.acme.platform, version: 2.7.1, purl: 'pkg:maven/org.acme.platform/core-lib@2.7.1', 'bom-ref': 'pkg:maven/org.acme.platform/core-lib@2.7.1'}]
                dependencies: [{ref: 'pkg:maven/org.acme.billing/billing-service@3.4.0-SNAPSHOT', dependsOn: ['pkg:maven/org.acme.platform/core-lib@2.7.1']}]
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '308': {$ref: 'common.yaml#/components/responses/RepoRenamed'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/dependencies/graph:
    get:
      operationId: getDependencyGraph
      summary: Organisation-wide internal dependency graph
      description: |-
        Nodes are manifest units, edges are declared dependencies on artifacts produced by another tracked unit
        (matched by published name or by source URL, architecture 13.3). Intra-repository edges (a Maven reactor, a
        workspace) are hidden unless `intra=true`. `focus` restricts the graph to the neighbourhood of a repository or
        unit within `depth` hops (both directions). Cycles are the strongly connected components of size > 1.

        The result is capped at 2,000 nodes and 20,000 edges; beyond that the nodes of highest degree are kept and
        `truncated` is true. `format=mermaid` returns the same graph as Mermaid flowchart text (`text/plain`) for
        embedding in Markdown; it is capped at 300 nodes. The graph is computed per view class: an anonymous caller
        sees only public repositories.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.graph
      x-scp-etag: snapshot-variant
      parameters:
        - name: group
          in: query
          description: Only units of the member repositories of this group.
          schema: {$ref: 'common.yaml#/components/schemas/GroupId'}
        - name: scope
          in: query
          style: form
          explode: true
          schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/DependencyScope'}}
        - name: ecosystem
          in: query
          style: form
          explode: true
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/EcosystemId'}}
        - name: intra
          in: query
          description: Include edges inside one repository.
          schema: {type: boolean, default: false}
        - name: internal
          in: query
          description: Restrict edges to internal dependencies (the only kind the graph has in v1; reserved for external-component nodes).
          schema: {type: boolean, default: true}
        - name: focus
          in: query
          description: A repository slug or a unit id; the graph is cut to its neighbourhood.
          schema: {type: string, minLength: 1, maxLength: 420}
        - name: depth
          in: query
          description: Hops from `focus` in either direction.
          schema: {type: integer, minimum: 1, maximum: 3, default: 1}
        - name: format
          in: query
          schema: {type: string, enum: [json, mermaid], default: json}
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The graph as JSON, or as Mermaid text when `format=mermaid`.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyGraph'}
              example: *dependencyGraph
            text/plain:
              schema: {type: string}
              example: "flowchart LR\n  billing_service[\"billing-service#.\"] --> core_lib[\"core-lib#.\"]\n"
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/dependencies/versions:
    get:
      operationId: getDependencyVersions
      summary: Version spread of components across the organisation
      description: >-
        For every component used by at least one unit, the histogram of versions in use (the locked version when known,
        else the requirement) with the number of units and repositories. Sorted by number of using units, then purl.
        Internal artifacts additionally report each consumer's position against the producer's current version
        (`current`, `behind`, `ahead`, `unknown`) in `getComponent` / `listComponentDependents`. No external data source is
        involved: "outdated against the registry" is a post-v1 provider.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.versions
      x-scp-etag: snapshot-variant
      parameters:
        - name: group
          in: query
          schema: {$ref: 'common.yaml#/components/schemas/GroupId'}
        - name: ecosystem
          in: query
          style: form
          explode: true
          schema: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/EcosystemId'}}
        - name: internal
          in: query
          description: '`true` only components produced by tracked repositories, `false` only external ones.'
          schema: {type: boolean}
        - name: minVersions
          in: query
          description: Only components used in at least this many distinct versions (2 shows drift).
          schema: {type: integer, minimum: 1, maximum: 100, default: 1}
        - $ref: 'common.yaml#/components/parameters/Q'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of component version spreads.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
            Link: {$ref: 'common.yaml#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionSpreadList'}
              example:
                items: [*spreadGuava]
                page: {nextCursor: null, limit: 50}
                freshness: *freshManifests
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/dependencies/licenses:
    get:
      operationId: getDependencyLicenses
      summary: Licence summary of dependencies
      description: >-
        Licences are **declared-only** in v1: a dependency has a licence only where its manifest or lockfile carries one;
        otherwise it falls into the `unknown` bucket, labelled "not declared in the manifest" by the UI and reported
        together with `coverage` so it is not read as a defect (traceability m4).
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.licenses
      x-scp-etag: snapshot-variant
      parameters:
        - name: group
          in: query
          schema: {$ref: 'common.yaml#/components/schemas/GroupId'}
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Licence buckets and coverage.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseSummary'}
              example:
                buckets:
                  - {license: Apache-2.0, components: 412, dependencies: 1980, repos: 171}
                  - {license: MIT, components: 633, dependencies: 2411, repos: 190}
                  - {license: unknown, components: 289, dependencies: 905, repos: 140}
                coverage: {declared: 1045, total: 1334, ratio: 0.783}
                freshness: *freshManifests
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/components:
    get:
      operationId: getComponent
      summary: One component by package URL
      description: >-
        Identity, producers (tracked units that publish it), number of using units and repositories, and the version
        histogram of a component. The `purl` is a **query parameter**, never a path segment (a purl contains `/`, `:`,
        `@`, `%`). A version in the purl is ignored for identity; the response `purl` is the normalised, versionless
        identity. 404 when no tracked unit uses or provides the component.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.component
      x-scp-etag: snapshot-variant
      parameters:
        - name: purl
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Purl'}
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The component.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Component'}
              example: *componentCoreLib
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/components/dependents:
    get:
      operationId: listComponentDependents
      summary: Reverse dependencies of a component ("used by")
      description: >-
        The units that depend on the component, with the requirement, the resolved version and, for internal artifacts,
        how far behind the producer each consumer is. Works for internal artifacts and for any external component
        ("who uses log4j-core"). Ordered by repository slug, then unit.
      tags: [manifests]
      x-scp-owner: manifests
      x-scp-route: api.manifests.dependents
      x-scp-etag: snapshot-variant
      parameters:
        - name: purl
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Purl'}
        - name: scope
          in: query
          style: form
          explode: true
          schema: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/DependencyScope'}}
        - name: group
          in: query
          schema: {$ref: 'common.yaml#/components/schemas/GroupId'}
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of dependents.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
            Link: {$ref: 'common.yaml#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependentList'}
              example:
                purl: 'pkg:maven/org.acme.platform/core-lib'
                items: [*dependentBilling]
                page: {nextCursor: null, limit: 50}
                freshness: *freshManifests
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

components:
  parameters:
    RepoFilterQ:
      name: q
      in: query
      description: Case-insensitive substring of the slug, title or summary.
      schema: {type: string, minLength: 1, maxLength: 200}
    RepoFilterLifecycle:
      name: lifecycle
      in: query
      description: Only repositories with this lifecycle (repeat to union). Repositories without a lifecycle never match.
      style: form
      explode: true
      schema: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/Lifecycle'}}
    RepoFilterType:
      name: type
      in: query
      description: Only repositories of this type (repeat to union).
      style: form
      explode: true
      schema: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/RepoType'}}
    RepoFilterTag:
      name: tag
      in: query
      description: Only repositories carrying all of these tags (repeat to intersect).
      style: form
      explode: true
      schema: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 63}}
    RepoFilterArchived:
      name: archived
      in: query
      description: '`include` (default), `exclude` or `only` archived repositories.'
      schema: {type: string, enum: [include, exclude, only], default: include}
    RepoSort:
      name: sort
      in: query
      description: 'Sort key; a leading `-` reverses. Ties are broken by slug. Missing values sort last.'
      schema: {type: string, enum: [name, -name, pushedAt, -pushedAt, lastCommit, -lastCommit, openIssues, -openIssues, lifecycle, -lifecycle], default: name}
  schemas:
    # ================================================================= overview
    Site:
      type: object
      description: Site settings. `repoCount` and `lastFullSync` are the header status.
      required: [title, description, nav, displayTimeZone, defaultTheme, lastFullSync, repoCount, groupCount, features, build]
      properties:
        title: {type: string, maxLength: 120}
        description: {type: string, maxLength: 500}
        nav: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/NavItem'}}
        announcement: {$ref: '#/components/schemas/Announcement'}
        displayTimeZone: {type: string, description: IANA zone name used to render times; stored data is UTC., examples: [Europe/Oslo]}
        defaultTheme: {type: string, enum: [system, light, dark]}
        lastFullSync: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        repoCount: {type: integer, minimum: 0, description: Tracked repositories visible to the caller's view class.}
        groupCount: {type: integer, minimum: 0}
        features: {$ref: '#/components/schemas/SiteFeatures'}
        build: {$ref: 'common.yaml#/components/schemas/BuildInfo'}
    NavItem:
      type: object
      description: 'A navigation entry: `kind: page` names a configured page (`page`), `kind: external` carries an https `url`.'
      required: [label, kind]
      properties:
        label: {type: string, maxLength: 60}
        kind: {type: string, enum: [page, external]}
        page: {$ref: 'common.yaml#/components/schemas/PageSlug'}
        url: {$ref: 'common.yaml#/components/schemas/HttpsUrl'}
    Announcement:
      type: object
      description: Plain text plus a level; no HTML. `id` is a content hash so a dismissal is remembered only until the text changes.
      required: [id, text, level, dismissible]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        text: {type: string, minLength: 1, maxLength: 500}
        level: {type: string, enum: [info, warning, critical]}
        dismissible: {type: boolean}
    SiteFeatures:
      type: object
      description: Switches the SPA needs to hide views of disabled features.
      required: [manifests, sse, integrations]
      properties:
        manifests: {type: boolean}
        sse: {type: boolean}
        integrations: {type: array, items: {type: string}, description: 'Enabled provider names, for example `jenkins`.'}
    RepoStats:
      type: object
      required: [openIssues, stars, pushedAt, headSha, lastCommitAt]
      properties:
        openIssues: {type: [integer, "null"], minimum: 0}
        stars: {type: integer, minimum: 0}
        license: {$ref: '#/components/schemas/License'}
        latestRelease: {$ref: '#/components/schemas/Release'}
        pushedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        headSha: {type: [string, "null"], pattern: '^[0-9a-f]{40,64}$'}
        lastCommitAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
    RepoSummary:
      type: object
      description: >-
        One repository as listed. `title`, `summary`, `type`, `lifecycle` and `tags` are resolved with provenance
        (descriptor, catalog-info, CODEOWNERS, GitHub topics, derived; architecture 14.2); a zero-config repository
        has `title` derived from its name and no `summary`, `type` or `lifecycle`.
      required: [slug, name, owner, title, archived, fork, visibility, defaultBranch, htmlUrl, tags, groups, stats, badges, uiUrl, apiUrl, markdownUrl, freshness]
      properties:
        slug: {$ref: 'common.yaml#/components/schemas/Slug'}
        name: {type: string, description: GitHub repository name., x-scp-untrusted: true}
        owner: {type: string, description: GitHub account that owns the repository.}
        title: {$ref: '#/components/schemas/SourcedString'}
        summary: {$ref: '#/components/schemas/SourcedString'}
        type: {$ref: '#/components/schemas/SourcedRepoType'}
        lifecycle: {$ref: '#/components/schemas/SourcedLifecycle'}
        archived: {type: boolean}
        fork: {type: boolean}
        visibility: {$ref: '#/components/schemas/Visibility'}
        defaultBranch: {type: string, x-scp-untrusted: true}
        htmlUrl: {$ref: 'common.yaml#/components/schemas/HttpsUrl'}
        tags: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        groups: {type: array, items: {$ref: '#/components/schemas/GroupRef'}}
        stats: {$ref: '#/components/schemas/RepoStats'}
        badges: {type: array, items: {$ref: 'common.yaml#/components/schemas/Badge'}}
        uiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        apiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        markdownUrl: {type: [string, "null"], description: 'Raw README route, null when the repository has no README.'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    RepoList:
      type: object
      required: [items, page, freshness]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RepoSummary'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    ApiRef:
      type: object
      description: An API the repository declares in `scp.yaml` (`apis`) or exposes by convention. SCP links to it; it does not serve the file.
      required: [type, title, path, url, sourceUrl, source]
      properties:
        type: {type: string, enum: [openapi, asyncapi, graphql, grpc, other]}
        title: {type: string, x-scp-untrusted: true}
        path: {type: [string, "null"], x-scp-untrusted: true}
        url: {type: [string, "null"], description: 'https URL declared by the descriptor.', x-scp-untrusted: true}
        sourceUrl: {type: [string, "null"], description: 'GitHub blob URL of `path`.'}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    DependsOn:
      type: object
      description: A declared or derived dependency of this repository on another repository.
      required: [repo, resolved, source]
      properties:
        repo: {type: string, maxLength: 140, description: The reference as authored (`name` or `owner/name`)., x-scp-untrusted: true}
        slug: {$ref: 'common.yaml#/components/schemas/Slug'}
        resolved: {type: boolean, description: False when the reference names no tracked repository (`slug` is then absent).}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    TechnologySummary:
      type: object
      description: Digest of the manifest facts for the repository header. Absent when manifests are disabled or no facts exist yet.
      required: [languages, ecosystems, buildTools, toolchain, unitCount, directDependencyCount, internalDependencyCount, diagnosticCount, parsedAt, manifestsUrl]
      properties:
        languages: {type: array, items: {$ref: 'common.yaml#/components/schemas/LanguageShare'}}
        ecosystems: {type: array, items: {type: string}}
        buildTools: {type: array, items: {type: string}}
        toolchain: {type: object, additionalProperties: {type: string}, description: 'For example `java: "21"`, `go: "1.27"`.'}
        unitCount: {type: integer, minimum: 0}
        directDependencyCount: {type: integer, minimum: 0}
        internalDependencyCount: {type: integer, minimum: 0}
        diagnosticCount: {type: integer, minimum: 0}
        parsedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        manifestsUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
    RepoSections:
      type: object
      description: Freshness of each upstream-backed section of the composite resource.
      properties:
        commits: {$ref: 'common.yaml#/components/schemas/Freshness'}
        docs: {$ref: 'common.yaml#/components/schemas/Freshness'}
        manifests: {$ref: 'common.yaml#/components/schemas/Freshness'}
        integrations: {$ref: 'common.yaml#/components/schemas/Freshness'}
    Repo:
      description: The composite repository resource (a `RepoSummary` plus every section of the repository page).
      allOf:
        - $ref: '#/components/schemas/RepoSummary'
        - type: object
          required: [description, owners, links, system, apis, dependsOn, docs, descriptor, statuses, latestCommits, sections]
          properties:
            description: {type: [string, "null"], description: GitHub repository description (plain text)., x-scp-untrusted: true}
            owners: {type: array, items: {$ref: '#/components/schemas/Owner'}}
            links: {type: array, items: {$ref: '#/components/schemas/Link'}}
            system: {type: [string, "null"], description: 'Descriptor `system` hint; group membership stays authoritative in configuration.'}
            apis: {type: array, items: {$ref: '#/components/schemas/ApiRef'}}
            dependsOn: {type: array, items: {$ref: '#/components/schemas/DependsOn'}}
            docs: {type: array, items: {$ref: 'common.yaml#/components/schemas/DocIndexEntry'}}
            descriptor: {$ref: 'common.yaml#/components/schemas/DescriptorInfo'}
            statuses: {type: array, items: {$ref: '#/components/schemas/ProviderStatus'}, description: 'One entry per enabled provider that has a target for this repository.'}
            technology: {$ref: '#/components/schemas/TechnologySummary'}
            latestCommits: {type: array, maxItems: 5, items: {$ref: 'common.yaml#/components/schemas/Commit'}}
            sections: {$ref: '#/components/schemas/RepoSections'}

    # ================================================================= live
    Snapshot:
      type: object
      required: [version, builtAt, readiness, buildId]
      properties:
        version: {type: integer, format: int64, minimum: 0, description: 'Snapshot version of this process: 0 before the first snapshot, otherwise increasing from 1 at every process start. Compare for inequality only, never for order.'}
        builtAt: {$ref: 'common.yaml#/components/schemas/Timestamp'}
        readiness: {type: string, enum: [warming, ready, degraded], description: '`warming` until the readiness gates are met, `degraded` when ready by deadline with incomplete coverage.'}
        buildId: {type: string}
    InvalidationTopic:
      type: string
      enum: [site, catalog, commits, docs, manifests, pages, status]
      description: Query families a client should refetch. Open enum.
    SseHello:
      type: object
      required: [generation, buildId]
      properties:
        generation: {type: integer, format: int64, minimum: 0}
        buildId: {type: string}
    SseInvalidate:
      type: object
      description: No repository names are carried (the stream must not enumerate invisible repositories).
      required: [topics, generation]
      properties:
        topics: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/InvalidationTopic'}}
        generation: {type: integer, format: int64, minimum: 0}
    SseResync:
      type: object
      required: [generation]
      properties:
        generation: {type: integer, format: int64, minimum: 0}
    SseEvent:
      description: 'Union of the `data:` payloads of the stream; the SSE `event:` name (`hello`, `invalidate`, `resync`) selects the member.'
      anyOf:
        - $ref: '#/components/schemas/SseHello'
        - $ref: '#/components/schemas/SseInvalidate'
        - $ref: '#/components/schemas/SseResync'

    # ================================================================= catalog
    GroupSummary:
      type: object
      description: A dashboard card. The badges are those of the group's default repository plus the group repository-count badge.
      required: [id, displayName, description, repoCount, defaultRepoState, integrations, badges, uiUrl, commitsUiUrl, apiUrl, llmsUrl, freshness]
      properties:
        id: {$ref: 'common.yaml#/components/schemas/GroupId'}
        displayName: {type: string}
        description: {type: [string, "null"], description: From configuration.}
        repoCount: {type: integer, minimum: 0, description: Members visible to the caller.}
        defaultRepoState: {type: string, enum: [ok, missing, unset], description: '`missing`: configured but not tracked; `unset`: the group has none.'}
        defaultRepo: {$ref: '#/components/schemas/RepoLink'}
        integrations: {type: array, items: {type: string}, description: Providers configured for the group.}
        badges: {type: array, items: {$ref: 'common.yaml#/components/schemas/Badge'}}
        uiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        commitsUiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        apiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        llmsUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [repos]
          properties:
            repos: {type: array, items: {$ref: 'common.yaml#/components/schemas/Slug'}, description: 'Member slugs visible to the caller, in configuration order.'}
    GroupList:
      type: object
      required: [items, page, freshness]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GroupSummary'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}

    # ================================================================= commits
    CommitPage:
      type: object
      required: [items, page, freshness]
      properties:
        items: {type: array, items: {$ref: 'common.yaml#/components/schemas/Commit'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}

    # ================================================================= docs
    DocIndex:
      type: object
      required: [repo, items, counts, descriptor, page, freshness]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        items: {type: array, items: {$ref: 'common.yaml#/components/schemas/DocIndexEntry'}}
        counts:
          type: object
          required: [total, resident, notResident]
          properties:
            total: {type: integer, minimum: 0}
            resident: {type: integer, minimum: 0}
            notResident: {type: integer, minimum: 0}
        descriptor: {$ref: 'common.yaml#/components/schemas/DescriptorInfo'}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    DocLink:
      type: object
      description: An outgoing link of the document after rewriting.
      required: [text, href, kind]
      properties:
        text: {type: string, x-scp-untrusted: true}
        href: {type: string, maxLength: 2000, x-scp-untrusted: true}
        kind: {type: string, enum: [doc, repo-file, external, anchor, media]}
    DocProblem:
      type: object
      description: A non-fatal front-matter or rendering problem.
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, x-scp-untrusted: true}
    Doc:
      description: A rendered document (a `DocIndexEntry` plus its content).
      allOf:
        - $ref: 'common.yaml#/components/schemas/DocIndexEntry'
        - type: object
          required: [repo, html, toc, frontMatter, links, problems, renderedBy, normalised, wordCount, freshness]
          properties:
            repo: {$ref: 'common.yaml#/components/schemas/Slug'}
            html: {type: [string, "null"], description: 'Sanitised HTML (`SafeHTML`), null unless `state` is `resident`.', x-scp-safe-html: true}
            toc: {type: array, items: {$ref: 'common.yaml#/components/schemas/TocEntry'}}
            frontMatter: {type: object, additionalProperties: true, description: 'Original front matter keys; only `title`, `description`, `order`, `tags`, `hidden` are interpreted.', x-scp-untrusted: true}
            links: {type: array, items: {$ref: '#/components/schemas/DocLink'}}
            problems: {type: array, items: {$ref: '#/components/schemas/DocProblem'}}
            renderedBy: {type: string, enum: [scp, github], description: '`github` for the AsciiDoc bridge.'}
            normalised: {type: array, items: {type: string}, description: 'Markers for transformations applied to the LLM Markdown variant (for example `hidden-comments-stripped`).'}
            wordCount: {type: integer, minimum: 0}
            freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}

    # ================================================================= pages
    PageSummary:
      type: object
      required: [slug, title, summary, order, updatedAt, uiUrl, apiUrl]
      properties:
        slug: {$ref: 'common.yaml#/components/schemas/PageSlug'}
        title: {type: string, x-scp-untrusted: true}
        summary: {type: [string, "null"], x-scp-untrusted: true}
        order: {type: integer}
        updatedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        uiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        apiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
    PageList:
      type: object
      required: [items, page, freshness]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PageSummary'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    Page:
      allOf:
        - $ref: '#/components/schemas/PageSummary'
        - type: object
          required: [html, toc, freshness]
          properties:
            html: {type: string, description: Sanitised HTML (`SafeHTML`)., x-scp-safe-html: true}
            toc: {type: array, items: {$ref: 'common.yaml#/components/schemas/TocEntry'}}
            freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    # ---- moved from common: used by one feature only
    Lifecycle:
      type: string
      enum: [experimental, production, deprecated]
      description: Backstage vocabulary (ADR-006). The UI may label `production` as "Active".
    RepoType:
      type: string
      enum: [service, library, website, tool, documentation, other]
    Visibility:
      type: string
      enum: [public, internal, private]
      description: Repository visibility on GitHub. Anonymous callers only ever see `public`.
    SourcedString:
      type: object
      required: [value, source]
      properties:
        value: {type: string, x-scp-untrusted: true}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    SourcedLifecycle:
      type: object
      required: [value, source]
      properties:
        value: {$ref: '#/components/schemas/Lifecycle'}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    SourcedRepoType:
      type: object
      required: [value, source]
      properties:
        value: {$ref: '#/components/schemas/RepoType'}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    Tag:
      type: object
      required: [value, source]
      properties:
        value: {type: string, pattern: '^[a-z0-9:+#]+(-[a-z0-9:+#]+)*$', maxLength: 63}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    Owner:
      type: object
      description: An ownership claim. A claim, not an authorisation (ADR-006).
      required: [handle, kind, source]
      properties:
        handle: {type: string, maxLength: 140, description: 'CODEOWNERS handle (`@user`, `@org/team`) or an unresolved reference such as `group:default/team-a`.', examples: ['@acme/billing-core'], x-scp-untrusted: true}
        kind: {type: string, enum: [user, team, group, unresolved]}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    Link:
      type: object
      required: [url, source]
      properties:
        url: {$ref: 'common.yaml#/components/schemas/HttpsUrl'}
        title: {type: string, maxLength: 120, x-scp-untrusted: true}
        type: {type: string, pattern: '^[a-z][a-z0-9-]{0,31}$', description: 'Well known: runbook, dashboard, issues, chat, status, api, docs, source, release, contact. Open.'}
        source: {$ref: 'common.yaml#/components/schemas/Provenance'}
    Release:
      type: object
      required: [tag, name, url, prerelease, publishedAt]
      properties:
        tag: {type: string, maxLength: 200, x-scp-untrusted: true}
        name: {type: [string, "null"], x-scp-untrusted: true}
        url: {$ref: 'common.yaml#/components/schemas/HttpsUrl'}
        prerelease: {type: boolean}
        publishedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
    License:
      type: object
      required: [spdxId, name]
      properties:
        spdxId: {type: string, maxLength: 100, examples: [Apache-2.0]}
        name: {type: [string, "null"]}
    GroupRef:
      type: object
      required: [id, displayName]
      properties:
        id: {$ref: 'common.yaml#/components/schemas/GroupId'}
        displayName: {type: string}
    ProviderStatus:
      type: object
      description: Status of one optional integration (Jenkins, Snyk) for a repository. Structured provider data, never scraped SVG.
      required: [provider, state, summary, detailUrl, observedAt, counts, freshness]
      properties:
        provider: {type: string, description: 'Open set: `jenkins`, `snyk`.', examples: [jenkins]}
        state: {$ref: 'common.yaml#/components/schemas/ProviderState'}
        summary: {type: string, maxLength: 300, x-scp-untrusted: true}
        detailUrl: {type: [string, "null"], description: 'https URL on the configured provider host, or null.'}
        observedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: 'For example Snyk `critical`, `high`, `medium`, `low`.'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    RepoLink:
      type: object
      description: Minimal reference to a repository.
      required: [slug, name, description, htmlUrl, uiUrl]
      properties:
        slug: {$ref: 'common.yaml#/components/schemas/Slug'}
        name: {type: string, description: GitHub repository name., x-scp-untrusted: true}
        title: {type: string, description: Display title when known., x-scp-untrusted: true}
        description: {type: [string, "null"], description: GitHub repository description (plain text)., x-scp-untrusted: true}
        htmlUrl: {$ref: 'common.yaml#/components/schemas/HttpsUrl'}
        uiUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
    # ================================================================= manifests
    EcosystemId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      maxLength: 32
      description: >-
        Stable lower-case ecosystem id; equals the purl type where one exists. Known in v1: maven, npm, pypi, golang,
        cargo, nuget, gem, composer, swift, pub, hex, cocoapods, docker, github (Actions), terraform, helm. Open set
        (a new ecosystem is added without a contract change).
      examples: [maven]
    DependencyScope:
      type: string
      enum: [runtime, dev, test, build, optional, peer, provided, unknown]
    Resolution:
      type: string
      enum: [declared, pinned, locked, managed]
      description: 'How trustworthy `version` is: `declared` only a requirement was found, `pinned` exact in the manifest, `locked` from a lockfile, `managed` filled from a BOM, catalog or workspace table.'
    Confidence:
      type: string
      enum: [exact, heuristic]
      description: '`heuristic` marks facts from lexical parsers of programs (Gradle scripts, `Package.swift`, `Gemfile`, `Podfile`, `mix.exs`).'
    VersionStatus:
      type: string
      enum: [current, behind, ahead, unknown]
      description: Position of a consumer against the producer's current version, for internal artifacts only.
    Diagnostic:
      type: object
      description: A non-fatal observation of a parser. Nothing is dropped silently; limits and dynamic constructs show up here.
      required: [code, message, severity, loc]
      properties:
        code: {type: string, pattern: '^[a-z0-9]+([.-][a-z0-9]+)*$', description: 'Stable code, for example `gradle.dynamic-dependency`, `limit.depth`, `encoding.unsupported`.', examples: [maven.unresolved-managed-version]}
        message: {type: string, maxLength: 500, x-scp-untrusted: true}
        severity: {type: string, enum: [info, warning, error]}
        loc: {$ref: '#/components/schemas/Location'}
    ManifestFile:
      type: object
      description: The exact bytes a unit was derived from.
      required: [path, blobSha, parser, kind]
      properties:
        path: {type: string, x-scp-untrusted: true}
        blobSha: {$ref: 'common.yaml#/components/schemas/Sha'}
        parser: {type: string, description: 'Parser id and version, `maven/pom@3`.', examples: ['maven/pom@3']}
        kind: {type: string, enum: [manifest, lockfile, catalog, workspace]}
    Artifact:
      type: object
      description: Something a unit publishes.
      required: [purl, version, kind]
      properties:
        purl: {$ref: '#/components/schemas/Purl'}
        version: {type: [string, "null"], description: 'May be a placeholder or null for dynamic versions.', x-scp-untrusted: true}
        kind: {type: string, enum: [library, application, plugin, bom, image, other]}
    UnitCounts:
      type: object
      required: [direct, internal, locked]
      properties:
        direct: {type: integer, minimum: 0, description: Declared dependencies.}
        internal: {type: integer, minimum: 0, description: Declared dependencies on other tracked repositories.}
        locked: {type: integer, minimum: 0, description: Components resolved by a lockfile (transitive included).}
    ManifestUnit:
      type: object
      description: One logical project (a Maven module, an npm package, a Go module, a crate, a csproj).
      required: [id, dir, ecosystem, role, provides, toolchain, files, counts, diagnostics]
      properties:
        id: {$ref: '#/components/schemas/UnitId'}
        dir: {type: string, description: 'Repository-relative directory of the primary file; `.` for the root.', x-scp-untrusted: true}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        role: {type: string, enum: [primary, fixture, example], description: '`fixture` and `example` units (test data, `examples/*`) are hidden by the UI by default.'}
        provides: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
        toolchain: {type: object, additionalProperties: {type: string}}
        files: {type: array, items: {$ref: '#/components/schemas/ManifestFile'}}
        counts: {$ref: '#/components/schemas/UnitCounts'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    EcosystemCount:
      type: object
      required: [ecosystem, units, dependencies]
      properties:
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        units: {type: integer, minimum: 0}
        dependencies: {type: integer, minimum: 0}
    RepoManifests:
      type: object
      required: [repo, treeSha, commitSha, parsedAt, truncated, languages, ecosystems, toolchain, units, counts, diagnostics, freshness]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        treeSha: {$ref: 'common.yaml#/components/schemas/Sha'}
        commitSha: {type: [string, "null"], pattern: '^[0-9a-f]{40,64}$'}
        parsedAt: {$ref: 'common.yaml#/components/schemas/NullableTimestamp'}
        truncated: {type: boolean, description: 'Tree discovery was truncated or capped (200 files, depth 12, 200 tree calls); some manifests may be missing.'}
        languages: {type: array, items: {$ref: 'common.yaml#/components/schemas/LanguageShare'}}
        ecosystems: {type: array, items: {$ref: '#/components/schemas/EcosystemCount'}}
        toolchain: {type: object, additionalProperties: {type: string}, description: Union over the primary units; a conflicting key is reported per unit only.}
        units: {type: array, items: {$ref: '#/components/schemas/ManifestUnit'}}
        counts:
          type: object
          required: [units, directDependencies, internalDependencies, lockedComponents]
          properties:
            units: {type: integer, minimum: 0}
            directDependencies: {type: integer, minimum: 0}
            internalDependencies: {type: integer, minimum: 0}
            lockedComponents: {type: integer, minimum: 0}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}, description: 'Repository-level diagnostics (tree truncation, parser circuit open).'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    InternalRef:
      type: object
      description: The tracked repository and unit that produce the depended-on artifact.
      required: [repo, unit, version]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        unit: {$ref: '#/components/schemas/UnitId'}
        version: {type: [string, "null"], description: Producer's current version., x-scp-untrusted: true}
    Dependency:
      type: object
      required: [purl, ecosystem, namespace, name, requirement, version, resolution, scope, group, relationship, optional, condition, source, sourceRef, confidence, loc, unit, provenance]
      properties:
        purl: {$ref: '#/components/schemas/Purl'}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        namespace: {type: [string, "null"], x-scp-untrusted: true}
        name: {type: string, x-scp-untrusted: true}
        displayName: {type: string, description: Original-case name when `name` was case-folded., x-scp-untrusted: true}
        requirement: {type: string, description: 'Raw requirement in the ecosystem syntax (`^1.2`, `[1.0,2.0)`, `${core.version}`), empty when the file gives none.', x-scp-untrusted: true}
        version: {type: [string, "null"], description: Exact version when known., x-scp-untrusted: true}
        resolution: {$ref: '#/components/schemas/Resolution'}
        scope: {$ref: '#/components/schemas/DependencyScope'}
        group: {type: string, description: 'Original group or configuration name (`devDependencies`, `testImplementation`).', x-scp-untrusted: true}
        relationship: {type: string, enum: [direct, transitive, unknown]}
        optional: {type: boolean}
        condition: {type: [string, "null"], description: Raw environment marker or target-framework condition; not evaluated., x-scp-untrusted: true}
        source: {type: string, enum: [registry, git, path, url]}
        sourceRef: {type: [string, "null"], x-scp-untrusted: true}
        confidence: {$ref: '#/components/schemas/Confidence'}
        loc: {$ref: '#/components/schemas/Location'}
        unit: {$ref: '#/components/schemas/UnitId'}
        internal: {$ref: '#/components/schemas/InternalRef'}
        provenance: {$ref: 'common.yaml#/components/schemas/Provenance'}
    DependencyList:
      type: object
      required: [repo, treeSha, items, page, freshness]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        treeSha: {$ref: 'common.yaml#/components/schemas/Sha'}
        items: {type: array, items: {$ref: '#/components/schemas/Dependency'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    GraphNode:
      type: object
      required: [id, repo, dir, ecosystem, label, artifacts, inDegree, outDegree, inCycle]
      properties:
        id: {$ref: '#/components/schemas/UnitId'}
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        dir: {type: string, x-scp-untrusted: true}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        label: {type: string, maxLength: 200, x-scp-untrusted: true}
        artifacts: {type: array, items: {$ref: '#/components/schemas/Purl'}}
        inDegree: {type: integer, minimum: 0, description: Units that depend on this one.}
        outDegree: {type: integer, minimum: 0, description: Units this one depends on.}
        inCycle: {type: boolean}
    GraphEdge:
      type: object
      required: [from, to, component, requirement, version, scope, intra, versionStatus]
      properties:
        from: {$ref: '#/components/schemas/UnitId'}
        to: {$ref: '#/components/schemas/UnitId'}
        component: {$ref: '#/components/schemas/Purl'}
        requirement: {type: string, x-scp-untrusted: true}
        version: {type: [string, "null"], x-scp-untrusted: true}
        scope: {$ref: '#/components/schemas/DependencyScope'}
        intra: {type: boolean, description: Both units are in the same repository.}
        versionStatus: {$ref: '#/components/schemas/VersionStatus'}
    GraphSummary:
      type: object
      required: [repos, units, edges, cycles, ecosystems]
      properties:
        repos: {type: integer, minimum: 0}
        units: {type: integer, minimum: 0}
        edges: {type: integer, minimum: 0}
        cycles: {type: integer, minimum: 0}
        ecosystems: {type: array, items: {$ref: '#/components/schemas/EcosystemCount'}}
    DependencyGraph:
      type: object
      required: [nodes, edges, cycles, summary, truncated, freshness]
      properties:
        nodes: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/GraphNode'}}
        edges: {type: array, maxItems: 20000, items: {$ref: '#/components/schemas/GraphEdge'}}
        cycles: {type: array, description: 'Each cycle is the list of unit ids of one strongly connected component (size > 1), diagnostic `graph.cycle`.', items: {type: array, minItems: 2, items: {$ref: '#/components/schemas/UnitId'}}}
        summary: {$ref: '#/components/schemas/GraphSummary'}
        truncated: {type: boolean, description: 'Nodes or edges were dropped to respect the caps.'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    VersionCount:
      type: object
      required: [version, units, repos]
      properties:
        version: {type: string, x-scp-untrusted: true}
        units: {type: integer, minimum: 0}
        repos: {type: integer, minimum: 0}
    ComponentSpread:
      type: object
      required: [purl, ecosystem, namespace, name, internal, users, repos, distinctVersions, versions, latestKnown]
      properties:
        purl: {$ref: '#/components/schemas/Purl'}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        namespace: {type: [string, "null"], x-scp-untrusted: true}
        name: {type: string, x-scp-untrusted: true}
        internal: {type: boolean, description: Produced by a tracked repository.}
        users: {type: integer, minimum: 0, description: Using units.}
        repos: {type: integer, minimum: 0}
        distinctVersions: {type: integer, minimum: 0}
        versions: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/VersionCount'}, description: Most used first; at most 50 entries.}
        latestKnown: {type: [string, "null"], description: 'Producer version for internal artifacts, otherwise the highest version in use by the ecosystem order, or null when unordered.', x-scp-untrusted: true}
    VersionSpreadList:
      type: object
      required: [items, page, freshness]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ComponentSpread'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    LicenseBucket:
      type: object
      required: [license, components, dependencies, repos]
      properties:
        license: {type: string, description: 'SPDX expression, or `unknown` for "not declared in the manifest".', x-scp-untrusted: true}
        components: {type: integer, minimum: 0}
        dependencies: {type: integer, minimum: 0}
        repos: {type: integer, minimum: 0}
    LicenseCoverage:
      type: object
      required: [declared, total, ratio]
      properties:
        declared: {type: integer, minimum: 0, description: Components with a declared licence.}
        total: {type: integer, minimum: 0}
        ratio: {type: number, minimum: 0, maximum: 1}
    LicenseSummary:
      type: object
      required: [buckets, coverage, freshness]
      properties:
        buckets: {type: array, items: {$ref: '#/components/schemas/LicenseBucket'}}
        coverage: {$ref: '#/components/schemas/LicenseCoverage'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    Producer:
      type: object
      required: [repo, unit, version, kind, ambiguous]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        unit: {$ref: '#/components/schemas/UnitId'}
        version: {type: [string, "null"], x-scp-untrusted: true}
        kind: {type: string, enum: [library, application, plugin, bom, image, other]}
        ambiguous: {type: boolean, description: 'Another unit publishes the same identity (`graph.ambiguous-producer`).'}
    Component:
      type: object
      required: [purl, ecosystem, namespace, name, internal, producers, users, repos, versions, dependentsUrl, freshness]
      properties:
        purl: {$ref: '#/components/schemas/Purl'}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        namespace: {type: [string, "null"], x-scp-untrusted: true}
        name: {type: string, x-scp-untrusted: true}
        internal: {type: boolean}
        producers: {type: array, items: {$ref: '#/components/schemas/Producer'}}
        users: {type: integer, minimum: 0}
        repos: {type: integer, minimum: 0}
        versions: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/VersionCount'}}
        dependentsUrl: {$ref: 'common.yaml#/components/schemas/PortalPath'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    Dependent:
      type: object
      required: [repo, unit, ecosystem, requirement, version, resolution, scope, direct, versionStatus, loc]
      properties:
        repo: {$ref: 'common.yaml#/components/schemas/Slug'}
        unit: {$ref: '#/components/schemas/UnitId'}
        ecosystem: {$ref: '#/components/schemas/EcosystemId'}
        requirement: {type: string, x-scp-untrusted: true}
        version: {type: [string, "null"], x-scp-untrusted: true}
        resolution: {$ref: '#/components/schemas/Resolution'}
        scope: {$ref: '#/components/schemas/DependencyScope'}
        direct: {type: boolean}
        versionStatus: {$ref: '#/components/schemas/VersionStatus'}
        loc: {$ref: '#/components/schemas/Location'}
    DependentList:
      type: object
      required: [purl, items, page, freshness]
      properties:
        purl: {$ref: '#/components/schemas/Purl'}
        items: {type: array, items: {$ref: '#/components/schemas/Dependent'}}
        page: {$ref: 'common.yaml#/components/schemas/PageInfo'}
        freshness: {$ref: 'common.yaml#/components/schemas/Freshness'}
    # ---- moved from common: used by one feature only
    Location:
      type: object
      description: Position inside a repository file (1-based line; 0 when unknown).
      required: [path, line]
      properties:
        path: {type: string, maxLength: 500, x-scp-untrusted: true}
        line: {type: integer, minimum: 0}

    # ------------------------------------------------------------------ cross-feature resources
    Purl:
      type: string
      pattern: '^pkg:[a-z][a-z0-9.+-]*/[^\s]+$'
      maxLength: 1024
      description: Package URL (ECMA-427). Always passed as a query parameter, never as a path segment.
      examples: ['pkg:maven/org.acme.platform/core-lib']
    UnitId:
      type: string
      pattern: '^[^#\s]{1,100}#[^\s]{1,300}$'
      description: 'Identifier of a manifest unit: `<repo slug>#<repo-relative directory>` (`.` is the root).'
      examples: ['billing-service#.', 'monorepo#services/api']

    # ------------------------------------------------------------------ vocabulary enums
