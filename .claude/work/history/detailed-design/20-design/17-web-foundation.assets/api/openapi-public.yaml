paths:
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      summary: This contract
      description: >-
        The bundled OpenAPI 3.1 document of the listener that answers (the public listener serves the public
        document, the admin listener the admin document). Embedded in the binary; the strong ETag is the content hash.
      tags: [meta]
      x-scp-owner: apispec
      x-scp-route: api.openapi
      x-scp-etag: body-hash
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The OpenAPI document.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/yaml:
              schema: {type: string}
              example: "openapi: 3.1.0\ninfo:\n  title: Source Code Portal API\n  version: 1.0.0\n"
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/site:
    get:
      operationId: getSite
      summary: Site settings and header status
      description: >-
        Branding, navigation, the optional announcement, the display time zone and theme default, the time of the last
        successful full sync and the number of tracked repositories for the caller's view class (Q-17).
        Everything comes from the `site:` configuration block; the embedded default is neutral (GR-14).
      tags: [overview]
      x-scp-owner: overview
      x-scp-route: api.site
      x-scp-etag: snapshot-variant
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Site settings.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
              example:
                title: Acme Source Code Portal
                description: Repositories, documentation and dependencies of the Acme platform teams.
                nav:
                  - {label: Docs, kind: page, page: about}
                  - {label: Status page, kind: external, url: 'https://status.acme.example'}
                announcement: {id: 'b7e41c0a', text: 'GitHub maintenance on Saturday 02:00-03:00 UTC; data may be stale.', level: info, dismissible: true}
                displayTimeZone: Europe/Oslo
                defaultTheme: system
                lastFullSync: '2026-10-14T09:41:07Z'
                repoCount: 212
                groupCount: 14
                features: {manifests: true, sse: false, integrations: [jenkins]}
                build: {version: 1.0.0, commit: 9c4e1f2, buildId: 9c4e1f2, goVersion: go1.27.2}
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      summary: Snapshot version for live updates
      description: >-
        The version of the immutable read model that answers requests. The SPA polls this endpoint (visibility-aware,
        15-30 s; the browser revalidates with the weak ETag, which names the process as well as the version, so an unchanged
        snapshot costs one 304) and invalidates its cached queries when the version **differs** from the last one it saw
        (never when it is merely greater: versions restart at 1 whenever the process restarts). Unlike every other
        operation it never answers `503 not-ready`: a cold start is `readiness: warming` with version 0 (ADR-009).
      tags: [live]
      x-scp-owner: live
      x-scp-route: api.snapshot
      x-scp-etag: snapshot-version
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current snapshot.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
              example: {version: 1841, builtAt: '2026-10-14T09:41:07Z', readiness: ready, buildId: 9c4e1f2}
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Invalidation event stream (Server-Sent Events)
      description: |-
        `text/event-stream`. An **invalidation channel only**: payloads carry no resource data, so a lost or replayed
        event is harmless and the contract of every other operation is unchanged (ADR-009). The client invalidates the
        named query topics and the ordinary conditional GETs transfer the data.

        Wire format: `retry: 3000` is sent first; every event has `id: <snapshot version>`, an `event:` name and one
        `data:` line of JSON; a comment line `: hb` is sent every 15 s. Events:

        | event | data schema | meaning |
        |---|---|---|
        | `hello` | `SseHello` | first event of every connection: current generation and build id |
        | `invalidate` | `SseInvalidate` | the named topics changed in the new generation (debounced 250-500 ms) |
        | `resync` | `SseResync` | the client is further behind than the 256-entry ring, or its `Last-Event-ID` is ahead of this process (a restart): invalidate everything |

        A build id different from the SPA's means a new deployment: reload. Per-IP limit: 4 concurrent streams. On
        shutdown the server sends `retry: 30000` and closes. The stream is never compressed and is excluded from the
        write timeout (`http.ResponseController`). Available when `live.sse.enabled` is true; otherwise `404 feature-disabled`.
      tags: [live]
      x-scp-owner: live
      x-scp-route: api.events
      x-scp-conditional: false
      x-scp-since: '1.1'
      x-scp-flag: live.sse.enabled
      parameters:
        - name: Last-Event-ID
          in: header
          description: >-
            Snapshot version of the last event the client saw (sent automatically by `EventSource`). A value ahead of the
            current version (the server restarted; versions restart at 1) or older than the change ring is answered with a
            `resync` event right after `hello`.
          schema: {type: string, pattern: '^[0-9]{1,20}$'}
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/SseEvent'}
              examples:
                hello: {summary: 'event: hello', value: {generation: 1841, buildId: 9c4e1f2}}
                invalidate: {summary: 'event: invalidate', value: {topics: [commits, catalog], generation: 1842}}
                resync: {summary: 'event: resync', value: {generation: 1900}}
              x-scp-wire-example: "retry: 3000\n\nid: 1841\nevent: hello\ndata: {\"generation\":1841,\"buildId\":\"9c4e1f2\"}\n\nid: 1842\nevent: invalidate\ndata: {\"topics\":[\"commits\",\"catalog\"],\"generation\":1842}\n\n: hb\n\n"
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

  /api/v1/groups:
    get:
      operationId: listGroups
      summary: Groups (dashboard cards)
      description: >-
        One entry per configured group in **configuration order**, so operators control the layout (pass
