        Everything the repository page needs in one call: resolved metadata with provenance, groups, the documentation
        index, declared APIs, dependencies on other repositories, integration statuses, a technology summary and the
        newest commits. Each section carries its own freshness in `sections`, so one failed upstream degrades one
        section, not the page. This is the structured counterpart of `/repos/{repo}.md` for agents.
