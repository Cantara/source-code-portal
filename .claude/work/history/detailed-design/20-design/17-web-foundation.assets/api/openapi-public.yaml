  - {name: overview, description: 'Cross-feature read composition: site settings, repository list and composite repository resource.'}
  - {name: live, description: 'Snapshot version for polling and the SSE invalidation channel.'}
  - {name: catalog, description: 'Groups and their membership.'}
  - {name: commits, description: 'The commit log.'}
  - {name: docs, description: 'Rendered documentation and descriptor metadata.'}
  - {name: manifests, description: 'Package-manifest intelligence (D-15 / N-01).'}
  - {name: pages, description: 'Config-driven Markdown pages.'}
x-scp-contract:
  routeTable: 'Every path below equals one entry of routes.Public() of class API (checked in both directions by apicheck and by a Go test).'
  conditionalGet: 'Every GET declares IfNoneMatch, a 200 with ETag, a 304 and a default problem response, except operations marked x-scp-conditional: false.'
  extensions:
    x-scp-owner: 'Go package that implements the operation (architecture 4.4).'
    x-scp-route: 'Name in routes.Table.'
    x-scp-etag: >-
      How the entity tag is derived (the string is opaque to clients). Every weak tag also names the process epoch, a random
      token per start, because snapshot versions restart at 1 and a version alone repeats across restarts.
      snapshot-variant: W/"g<epoch>-<snapshot version>-<view class>[.<digest>]"; repo-rev (only for bodies that are a pure
      function of one repository entry): W/"r<epoch>-<repository revision>-<view class>[.<digest>]"; tree-sha:
      W/"t<epoch>-<tree sha>-<view class>" (the SBOM also depends on the parser version, so a new process never reuses a tag); snapshot-version: W/"v<epoch>-<version>"; body-hash: hash of the body bytes; none.
      The optional digest is present only when a contributing item is not fresh and changes when any derived freshness
      status changes (design 07, section 4.5).
    x-scp-conditional: 'false when conditional GET does not apply (streams).'
    x-scp-since: 'Contract version that introduced the operation when later than 1.0.'
    x-scp-flag: 'Configuration key that switches the operation on.'
    x-scp-untrusted: 'true on schema members that carry repository-authored text.'
