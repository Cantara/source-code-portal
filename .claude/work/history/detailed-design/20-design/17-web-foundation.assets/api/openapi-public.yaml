  /api/v1/commits:
    get:
      operationId: listCommits
      summary: Commit log
      description: |-
        Commits of the default branch (Q-18), newest first, across every visible repository or restricted by `repo`
        and/or `group` (both given: the repository must be a member of the group, otherwise the page is empty). The SPA
        groups the rows by calendar day in the viewer's zone itself; timestamps are UTC.

        Served by a k-way merge of the per-repository lists held in the snapshot; a page never scans the history and an
        arbitrary cursor is cheap (architecture 9.5). The dashboard's "latest commits" panel is the first page with a
        small `limit`. At most 30 commits per repository are retained (`commits.keep`), so the log is bounded by
        30 x repositories. An unknown or invisible `repo` or `group` is 404, and so is a `repo` that is only the old
        slug of a renamed repository: the `308` redirect applies to path parameters, never to query values, so a client
        that holds an old slug re-reads it from `listRepos` (design 07, section 4.7).
      tags: [commits]
      x-scp-owner: commits
      x-scp-route: api.commits
      x-scp-etag: snapshot-variant
      parameters:
        - name: repo
          in: query
          description: Restrict to one repository (slug).
          schema: {$ref: 'common.yaml#/components/schemas/Slug'}
        - name: group
          in: query
          description: Restrict to the member repositories of one group.
          schema: {$ref: 'common.yaml#/components/schemas/GroupId'}
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A page of commits.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
            Link: {$ref: 'common.yaml#/components/headers/Link'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommitPage'}
              example:
                items: [*commitA, *commitB]
                page: {nextCursor: eyJ2IjoxLCJ0IjoxNzYwNDMxMjAwLCJzIjoiM2YyYTljMSIsImYiOiJhMWIyYzNkNCJ9, limit: 2}
                freshness: *freshCommits
        '304': {$ref: 'common.yaml#/components/responses/NotModified'}
        '400': {$ref: 'common.yaml#/components/responses/BadRequest'}
        '404': {$ref: 'common.yaml#/components/responses/NotFound'}
        '429': {$ref: 'common.yaml#/components/responses/RateLimited'}
        '503': {$ref: 'common.yaml#/components/responses/NotReady'}
        default: {$ref: 'common.yaml#/components/responses/Problem'}

