        - name: docId
          in: path
          required: true
          description: >-
            The `DocIndexEntry.id` of the document (schema `DocId`). The parameter schema is the *wire form*: the id with
            every `%` percent-encoded once more (`docs~Release%2520Notes.md` for the id `docs~Release%20Notes.md`), which is
            what kin-openapi validates; the handler receives the decoded id.
          schema: {type: string, minLength: 1, maxLength: 3100, pattern: '^[A-Za-z0-9._~%-]+$'}
        - $ref: 'common.yaml#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The document.
          headers:
            ETag: {$ref: 'common.yaml#/components/headers/ETag'}
          content:
