    forbidigo:
      analyze-types: true
      forbid:
        # G2: no fmt printing in libraries (cmd/scp may print: see exclusions)
        - pattern: '^fmt\.(Print|Printf|Println)$'
          msg: "G2: write through an injected io.Writer or slog; only cmd/scp prints"
        # G3/G4: no hidden default instances
        - pattern: '^http\.(Get|Post|Head|PostForm|DefaultClient|DefaultServeMux|DefaultTransport|ListenAndServe|ListenAndServeTLS|Handle|HandleFunc|Serve|ServeTLS)$'
          msg: "G4: use platform/httpx.NewServer and netguard/adapter clients, never http defaults"
        - pattern: '^http\.Server$'
          msg: "G4: construct servers with platform/httpx.NewServer"
        # G9: process environment belongs to the composition root
        - pattern: '^os\.(Getenv|LookupEnv|Environ|Setenv|Exit|Args)$'
          msg: "G9: configuration arrives by constructor; only cmd/scp reads the environment, args and exits"
        - pattern: '^signal\.(Notify|NotifyContext|Stop|Ignore)$'
          msg: "G9: only cmd/scp installs signal handlers"
        - pattern: '^slog\.(SetDefault|Default|SetLogLoggerLevel)$'
          msg: "G3: no global logger; only cmd/scp may call slog.SetDefault"
        # G11: telemetry through injected Meter and Tracer (API modules), never the global accessors
        - pattern: '^otel\.(Meter|Tracer|GetMeterProvider|GetTracerProvider|SetMeterProvider|SetTracerProvider|SetTextMapPropagator|GetTextMapPropagator|SetErrorHandler)$'
          msg: "G11: take a metric.Meter / trace.Tracer in Deps; globals only in cmd/scp and platform/telemetry"
        # GR-22: no per-call clients or breakers
        - pattern: '^gobreaker\.(NewCircuitBreaker|NewTwoStepCircuitBreaker)$'
          msg: "GR-22: one breaker per upstream, constructed in internal/github"
        # GR-36: no subprocess
        - pattern: '^exec\.(Command|CommandContext)$'
          msg: "GR-36: no subprocess outside internal/gitsource and cmd/scp"
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      no-global: all
      context: all
      static-msg: true
      key-naming-case: snake
    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations: [errors]
          reason: "G2: standard library errors only"
        - module: gopkg.in/yaml.v3
          recommendations: [go.yaml.in/yaml/v3]
          reason: "A-07: the gopkg.in/yaml.v3 repository is archived"
        - module: github.com/google/go-github
          match-type: prefix
          reason: "ADR-004: own thin client; no go-github"
        - module: github.com/go-git/go-git
          match-type: prefix
          reason: "D-17/8.15: git mode shells out to the git binary"
        - module: github.com/tebeka/selenium
          reason: "GR-13: no browser automation in the module graph"
        - module: github.com/patrickmn/go-cache
          reason: "GR-28: one read model, no cache library"
        - module: github.com/dgraph-io/ristretto
          match-type: prefix
          reason: "GR-28: one read model, no cache library"
        - module: github.com/maypok86/otter
          match-type: prefix
          reason: "A-02: not adopted without profiling evidence"
        - module: github.com/spf13/cobra
          reason: "the CLI is stdlib flag (design 16, section 4)"
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: import-shadowing
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: false
        - name: use-any
    gosec:
      excludes: [G104]   # errcheck owns unchecked errors
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    usetesting:
      os-temp-dir: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets: [comments, common-false-positives, legacy, std-error-handling]
    rules:
      # cmd/scp is the composition root: it prints, reads the environment and args, exits, handles signals and sets slog default.
      - path: ^cmd/scp/
        linters: [forbidigo]
        text: 'G2|G3|G9|G11'
      - path: ^cmd/fakegithub/
        linters: [forbidigo]
        text: 'G2|G9'
      # platform/httpx is the only constructor of *http.Server; netguard/github own clients.
      - path: ^internal/platform/(httpx|netguard)/
        linters: [forbidigo]
        text: 'G4'
      - path: ^internal/platform/telemetry/
        linters: [forbidigo]
        text: 'G11'
      - path: ^internal/github/
        linters: [forbidigo]
        text: 'GR-22'
      # GR-36: the owners of os/exec in archtest.OwnedImports(): git mode, cmd/scp (the token_command runner of 05 2.5) and archtest (go list)
      - path: ^(internal/gitsource|cmd/scp|internal/archtest)/
        linters: [forbidigo]
        text: 'GR-36'
      # the one allowed mutable-looking package variables: values stamped by -ldflags -X (see cmd/scp/buildinfo.go)
      - path: ^cmd/scp/buildinfo\.go$
        linters: [gochecknoglobals]
      # tests: hand-written fakes, httptest, deliberate globals in helpers
      - path: _test\.go$
        linters: [gosec, gochecknoglobals, errcheck, forbidigo]
        text: 'G104|G304|G306|G301|G302|G303|G9|G2|errcheck|.*'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false   # two linters on one import line must both report (depguard hides behind revive otherwise)

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/cantara/source-code-portal]
