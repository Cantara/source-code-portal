# golangci-lint v2.14.0 (pinned binary; `go tool` and `go install` are not recommended by the project).
# The depguard rules between the markers are GENERATED from internal/archtest/rules.go (ADR-018); run `make arch-fix`.
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - errorlint
    - nilerr
    - wastedassign
    - copyloopvar
    - asasalint
    - fatcontext
    - exhaustive
    # lifetimes and context (G10, GR-03)
    - noctx
    - contextcheck
    - containedctx
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - spancheck
    # boundaries and globals (G1-G6, G11)
    - depguard
    - forbidigo
    - gomodguard_v2
    - gochecknoinits
    - gochecknoglobals
    - sloglint
    # style that carries meaning
    - errname
    - revive
    - predeclared
    - recvcheck
    - inamedparam
    - canonicalheader
    - usestdlibvars
    - intrange
    - modernize
    - mirror
    - unconvert
    - dupword
    - misspell
    - gocheckcompilerdirectives
    - nolintlint
    # tests (GR-43)
    - usetesting
    - thelper
    # security
    - gosec
  settings:
    depguard:
      rules:
        # BEGIN GENERATED depguard rules (internal/archtest/depguard.go; run `make arch-fix` after editing rules.go)
        arch_cmd_fakegithub:
          list-mode: lax
          files: ["**/cmd/fakegithub/*.go"]
          deny:
            - pkg: github.com/cantara/source-code-portal
              desc: "cmd/fakegithub (rank 6) may import only the packages of its row in internal/archtest/rules.go"
          allow:
            - $gostd
            - github.com/cantara/source-code-portal/cmd/fakegithub$
            - github.com/cantara/source-code-portal/internal/github/githubtest$
            - github.com/cantara/source-code-portal/internal/scm$
        arch_cmd_scp_internal_bridge:
          list-mode: lax
