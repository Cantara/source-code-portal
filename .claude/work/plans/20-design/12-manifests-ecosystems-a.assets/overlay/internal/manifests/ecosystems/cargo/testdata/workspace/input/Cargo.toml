[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/old"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = "1.38"
mylib-core = { path = "crates/core", version = "0.4.0" }
regex = { git = "https://github.com/rust-lang/regex.git", tag = "1.10.3" }

[patch.crates-io]
serde_json = { path = "vendor/serde_json" }
