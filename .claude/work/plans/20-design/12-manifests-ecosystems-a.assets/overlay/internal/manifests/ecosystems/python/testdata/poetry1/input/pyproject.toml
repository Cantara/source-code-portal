[tool.poetry]
name = "poetry1-app"
version = "1.0.0"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
flask = "^2.0"
celery = { version = "^5.3", extras = ["redis"], optional = true }
pendulum = [
    { version = "^2.0", python = "<3.12" },
    { version = "^3.0", python = ">=3.12" },
]
mylib = { path = "../mylib", develop = true }

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[tool.poetry.extras]
tasks = ["celery"]
