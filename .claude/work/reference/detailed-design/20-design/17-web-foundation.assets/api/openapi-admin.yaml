  /api/v1/site: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1site'}
  /api/v1/snapshot: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1snapshot'}
  /api/v1/events: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1events'}
  /api/v1/groups: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1groups'}
  /api/v1/groups/{groupId}: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1groups~1{groupId}'}
  /api/v1/groups/{groupId}/repos: {$ref: 'openapi-public.yaml#/paths/~1api~1v1~1groups~1{groupId}~1repos'}
