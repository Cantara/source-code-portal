openapi: 3.1.0
info:
  title: Source Code Portal admin API
  version: 1.0.0
  summary: The public API plus the operator operations, served on the admin listener only.
  description: |
    The admin document is a **superset** of `openapi-public.yaml` (ADR-020: "admin root: public + ops admin
    operations"): every public operation is also answered on the admin listener (the same handler objects are
    mounted on the admin mux; identity-trust logic never runs there, so the caller is always anonymous and sees the
    public view class), and two operations exist only here.

    | operationId | Method and path | Purpose |
    |---|---|---|
    | `getStatus` | `GET /api/v1/status` | readiness gates, store health, snapshot, upstreams, installations, jobs, tasks, item ages, warnings |
    | `retryJob` | `POST /api/v1/admin/jobs/retry` | force one keyed job to run now (unparks a parked key) |

    The admin listener is reachable only from a restricted network (`:9091`, never routed by the ingress). The
    SPA is generated from the bundled admin document, so `/status` (served by the same bundle) and the public
    views share one `schema.d.ts`. The conventions of the public document apply unchanged; in addition:
    state-changing requests need `Content-Type: application/json`, the header `X-SCP-Request: 1`, and pass
    `http.CrossOriginProtection` (a cross-origin browser request is `403 forbidden`).
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
  - url: /
    description: Same origin as the admin listener.
tags:
  - {name: ops, description: 'Operator view of the running process (admin listener only).'}
x-scp-contract:
  document: admin
  extends: openapi-public.yaml
  listener: admin
security: []
