buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
}

plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id "com.github.ben-manes.versions" version "0.51.0"
}

apply plugin: 'maven-publish'
apply from: "$rootDir/gradle/publish.gradle"

group = 'com.acme'
version = '2.1.0'
sourceCompatibility = JavaVersion.VERSION_17

ext {
    junitVersion = '5.10.2'
    guavaVersion = "33.2.1-jre"
}
def slf4j = '2.0.13'

repositories { mavenCentral() }

dependencies {
    implementation 'com.google.guava:guava:' + guavaVersion
    implementation "org.slf4j:slf4j-api:$slf4j"
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.14.0'
    api('com.fasterxml.jackson.core:jackson-databind:2.17.1') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-annotations'
    }
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    runtimeOnly 'org.postgresql:postgresql:42.7.3'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':lib')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'io.netty:netty-all:4.1.+'
    implementation 'com.example:ranged:[1.0,2.0)'
    implementation 'org.example:with-classifier:1.0:tests@jar'
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation(unknownCall())
    integrationTestImplementation 'org.testcontainers:testcontainers:1.19.8'
    constraints {
        implementation('org.apache.logging.log4j:log4j-core:2.23.1') { because 'CVE' }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.2"
    }
}

subprojects {
    dependencies {
        testImplementation 'org.mockito:mockito-core:5.12.0'
    }
}
