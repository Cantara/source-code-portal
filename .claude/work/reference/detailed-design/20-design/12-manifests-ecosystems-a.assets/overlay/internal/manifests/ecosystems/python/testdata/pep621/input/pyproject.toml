[build-system]
requires = ["hatchling>=1.21", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "Acme_Billing.Service"
version = "2.3.0"
description = "ignored free text"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "Django_Foo.Bar[extras]>=4.2,<5 ; python_version >= '3.10'",
  "requests (>=2.31)",
  "pydantic==2.7.1",
  "acme-core @ git+https://ci-bot:s3cr3t@github.com/acme/core.git@v1.2",
  "not a valid requirement !!",
]

[project.optional-dependencies]
redis = ["redis>=5"]

[dependency-groups]
test = ["pytest>7", {include-group = "coverage"}]
coverage = ["coverage[toml]"]
docs = ["sphinx<9"]
loop-a = [{include-group = "loop-b"}]
loop-b = [{include-group = "loop-a"}]
broken = [{include-group = "nope"}]
