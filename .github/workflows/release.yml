# A tag v* builds and publishes the release: binaries, signed checksums and the multi-platform image
# ghcr.io/cantara/source-code-portal:<version> (and :latest for a full release), then smoke-tests the published image.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  PNPM_VERSION: 12.11.2
  GORELEASER_VERSION: v2.18.3

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # the image
      id-token: write # keyless cosign signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - run: npm install --global --ignore-scripts pnpm@${PNPM_VERSION}
      - name: web UI
        run: make web BUILD_ID=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: smoke-test the published image
        run: |
          image=ghcr.io/cantara/source-code-portal:${GITHUB_REF_NAME#v}
          docker run --rm --read-only --cap-drop=ALL "$image" version | tee /dev/stderr | grep -q 'web=spa'
          cosign verify "$image" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
