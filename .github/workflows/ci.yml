# One required status check protects main: "gate". Actions are pinned by commit SHA (Renovate updates SHA and comment together);
# the token is read-only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  PNPM_VERSION: 12.11.2

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      # The cluster tests run against a real Hazelcast on loopback (internal/cluster, cmd/scp TestCluster).
      hazelcast:
        image: hazelcast/hazelcast:5.7.0@sha256:f086bf0ecb23fcb2e9a516e337e51018156b89df41543ab768b8468ab281ad67
        ports: ["127.0.0.1:5701:5701"]
        env:
          HZ_NETWORK_PUBLICADDRESS: 127.0.0.1:5701
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: modules verified and tidy
        run: go mod verify && go mod tidy -diff
      - name: generated code is current
        run: go generate ./... && git diff --exit-code
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: binary
      - run: go vet ./...
      - name: hazelcast is up
        run: timeout 120 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/5701) 2>/dev/null; do sleep 1; done'
      - run: go test -race -count=1 -timeout 10m ./...
        env:
          TEST_HAZELCAST: 127.0.0.1:5701
      - run: go tool govulncheck ./...

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - run: npm install --global --ignore-scripts pnpm@${PNPM_VERSION}
      - run: pnpm -C web install --frozen-lockfile
      - name: generated API types are current
        run: pnpm -C web gen && git diff --exit-code
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web format:check
      - run: pnpm -C web test
      - run: pnpm -C web build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - run: npm install --global --ignore-scripts pnpm@${PNPM_VERSION}
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: BUILD_ID=${{ github.sha }} pnpm -C web build
      - run: pnpm -C web e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: make image VERSION=ci BUILD_ID=${{ github.sha }}
      - name: smoke
        run: docker run --rm --read-only --cap-drop=ALL scp:dev version

  gate:
    if: always()
    needs: [go, web, e2e, image]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: all jobs succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
