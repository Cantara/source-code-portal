# CI runs only quick checks (every job is cut off at 10 minutes). The browser tests (`make e2e`) and the size and time checks of the
# index and the 1,000-repository load (`make test`) run locally in `make check` before the pull request (P-85).
# The "gate" job sums up the others. Actions are pinned by commit SHA (Renovate updates SHA and comment together);
# the token is read-only.
name: ci

# A change of only documents runs nothing (the paths below); the documents a test reads still do.
on:
  pull_request:
    paths:
      - "**"
      # Documents, plans and the operators' plugin build nothing: a change of only these runs no CI.
      - "!docs/**"
      - "!.claude/**"
      - "!plugins/**"
      - "!.claude-plugin/**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!SECURITY.md"
      - "!AGENTS.md"
      - "!LICENSE"
      # but the documents a test reads (cmd/scp TestPrerequisitesDocumented): they must agree with the code.
      - "docs/operator-guide.md"
      - "docs/production.md"
      - "docs/security-model.md"
      - "plugins/scp/skills/run-scp/SKILL.md"
      - ".claude/skills/configure-scp/SKILL.md"
  push:
    branches: [main]
    paths:
      - "**"
      # The same as for a pull request. Documents, plans and the operators' plugin build nothing: a change of only these runs no CI.
      - "!docs/**"
      - "!.claude/**"
      - "!plugins/**"
      - "!.claude-plugin/**"
      - "!README.md"
      - "!CHANGELOG.md"
      - "!SECURITY.md"
      - "!AGENTS.md"
      - "!LICENSE"
      # but the documents a test reads (cmd/scp TestPrerequisitesDocumented): they must agree with the code.
      - "docs/operator-guide.md"
      - "docs/production.md"
      - "docs/security-model.md"
      - "plugins/scp/skills/run-scp/SKILL.md"
      - ".claude/skills/configure-scp/SKILL.md"
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  PNPM_VERSION: 12.18.0

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: modules verified and tidy
        run: go mod verify && go mod tidy -diff
      - name: generated code is current
        run: go generate ./... && git diff --exit-code
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: binary
      - run: go vet ./...
      # No service containers in CI: the cluster tests run on the in-memory backend (cluster.md).
      - run: go test -race -count=1 -timeout 5m ./...
      - run: go tool govulncheck ./...

  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - run: npm install --global --ignore-scripts pnpm@${PNPM_VERSION}
      - run: pnpm -C web install --frozen-lockfile
      - name: generated API types are current
        run: pnpm -C web gen && git diff --exit-code
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web format:check
      - run: pnpm -C web test
      - run: pnpm -C web build

  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: make image VERSION=ci BUILD_ID=${{ github.sha }}
      - name: smoke
        run: |
          docker run --rm --read-only --cap-drop=ALL scp:dev version
          docker run --rm --read-only --cap-drop=ALL --entrypoint /nodejs/bin/node scp:dev -e 'process.exit(require("fs").existsSync("/web/server.js") ? 0 : 1)'

  gate:
    if: always()
    needs: [go, web, image]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: all jobs succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
