openapi: 3.1.0
info:
  title: Source Code Portal API
  version: "1"
  description: |
    Read API over the portal's snapshot. Lists are returned whole, except commits, which come in numbered pages. Every 200 response carries a weak ETag; send it back in
    If-None-Match to get 304 Not Modified. Errors are RFC 9457 problems.
servers:
  - url: /api/v1
paths:
  /dashboard:
    get:
      operationId: getDashboard
      summary: Groups with counts and latest activity, the latest commits and data health
      parameters:
        - { $ref: "#/components/parameters/Work" }
      responses:
        "200":
          description: The dashboard
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "304": { $ref: "#/components/responses/NotModified" }
  /commits:
    get:
      operationId: listCommits
      summary: Default-branch commits merged across repositories, newest first, one page at a time
      description: |
        Order is committedAt descending, then repository address, then SHA. `group` and `repo` intersect. Pages are numbered from 1
        over the current snapshot, `limit` commits each; a page past the last is empty, and `page` says how many there are. New
        commits move the older ones to later pages. The freshness covers every repository in scope: fresh when all are fresh, stale
        otherwise, with the oldest times.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
        - { name: automation, in: query, required: false, description: "false leaves out commits made by automation", schema: { type: boolean, default: true } }
        - { $ref: "#/components/parameters/Work" }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of commits
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pulls:
    get:
      operationId: listPulls
      summary: Open pull requests across repositories, whose turn first, one page at a time
      description: |
        Every open pull request of the viewer's view (design/pulls.md). Each has one state and the party it waits for. The default
        order, `waiting`, puts people's pull requests before automation's, those waiting for reviewers first, then the longest idle.
        `group` and `repo` intersect; `by` keeps people's or automation's; drafts are left out unless `drafts` or `state=draft`.
        `counts` cover the scope and `by` (drafts included) whatever the state filter, so the states can be offered as filters.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/PullState" } }
        - { name: by, in: query, required: false, description: "people or automation; absent: both", schema: { type: string, enum: [people, automation] } }
        - { name: drafts, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: sort, in: query, required: false, schema: { $ref: "#/components/schemas/QueueSort" } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of pull requests
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /issues:
    get:
      operationId: listIssues
      summary: Open issues across repositories, where each stands, one page at a time
      description: |
        Every open issue of the viewer's view (design/issues.md), pull requests left out. Each has one state: assigned, triage (no
        label, milestone or issue type) or unassigned, and a kind. The default order, `waiting`, puts people's issues before
        automation's, those needing triage first, then unassigned, then assigned, then the longest idle. `group` and `repo`
        intersect; `by` keeps people's or automation's. `counts` cover the scope and `by` whatever the state and kind filters, so they
        can be offered as filters.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/IssueState" } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/IssueKind" } }
        - { name: by, in: query, required: false, description: "people or automation; absent: both", schema: { type: string, enum: [people, automation] } }
        - { name: sort, in: query, required: false, schema: { $ref: "#/components/schemas/QueueSort" } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of issues
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /releases:
    get:
      operationId: listReleases
      summary: Recent releases across repositories, newest first, one page at a time
      description: |
        The releases of the viewer's view (design/releases.md), from each repository's 20 newest published ones. `variant` chooses what is
        listed: `latest` (the default) is one row per repository, its newest stable release; `all` every kept release; `stable` the
        non-pre-releases; `pre` the pre-releases. `since` keeps the releases published at or after a time, an RFC 3339 time or a number
        of days such as `30d`. `group` and `repo` intersect. `counts` cover the scope and `since` whatever the variant, so the variants
        can be offered as filters. A repository's published packages are releases too: each package's newest release (the registry's, as
        a repository's `packages` say) is a row of source `maven`, `npm` and so on beside the GitHub releases (source `github`), unless a
        GitHub release of the same version is listed. `source` limits the list to one kind; `latest` is then one row per repository, the
        newest of that kind (of both for `all`). The counts of the variants follow `source`, those of the sources follow `variant`.
        A row carries the notes of its version (`notes`, HTML): the GitHub release's own, else the section of the repository's changelog.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
        - { name: variant, in: query, required: false, schema: { $ref: "#/components/schemas/ReleaseVariant" } }
        - { name: source, in: query, required: false, schema: { $ref: "#/components/schemas/ReleaseSource" } }
        - { name: since, in: query, required: false, description: "An RFC 3339 time or days such as 30d", schema: { type: string, maxLength: 40 } }
        - { name: sort, in: query, required: false, schema: { $ref: "#/components/schemas/ReleaseSort" } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of releases
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasePage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /insights:
    get:
      operationId: getInsights
      summary: What the held data says about the fleet, derived on request
      description: |
        Five insights of the viewer's view (design/insights.md), all derived from what the portal holds: how often the fleet ships
        (stable releases per month, the median days between a product's last stable releases), the technology manifests declare, the
        internal libraries most repositories depend on, the repositories where one person wrote nearly all of the people's recent
        commits, and the repositories by how long ago they last changed. It names repositories, never people. `group` and `repo`
        narrow the scope; the thresholds used are in the answer.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
      responses:
        "200":
          description: The insights
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insights" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /archive:
    get:
      operationId: listArchive
      summary: The retired repositories, newest activity first, one page at a time
      description: |
        The archive of the viewer's view (design/archive.md): repositories GitHub archived or whose `scp.yaml` says `lifecycle: deprecated`
        (archived wins). Each row says why, when it was last active (the newest default-branch commit, else the last push; no date of
        retirement is invented), how many other repositories still depend on it and how many authors its recent commits have (counted,
        never named). `group` narrows to a group's members, `q` to names containing the text, `reason` to one reason, `used` to those
        something still depends on. `counts` cover the group and `q` whatever the other filters, so they can be offered as filters.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, description: "Part of the repository's name", schema: { type: string, maxLength: 100 } }
        - { name: reason, in: query, required: false, schema: { $ref: "#/components/schemas/ArchiveReason" } }
        - { name: used, in: query, required: false, description: "Only those another repository still depends on", schema: { type: boolean, default: false } }
        - { name: sort, in: query, required: false, schema: { $ref: "#/components/schemas/ArchiveSort" } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of archive
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivePage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /prerequisites:
    get:
      operationId: getPrerequisites
      summary: The features whose GitHub prerequisites do not hold, and how to fix them
      description: |
        What each feature needs from GitHub (read permissions, webhook events) checked against the GitHub App's installations, or for
        a token against the reads GitHub refused (design/prerequisites.md). Empty when every prerequisite holds. The source, the
        accounts, the missing permissions and events and the fix are given to administrators only.
      responses:
        "200":
          description: The unmet prerequisites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrerequisiteList" }
  /groups:
    get:
      operationId: listGroups
      summary: All groups in configuration order, with member counts
      responses:
        "200":
          description: The groups
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "304": { $ref: "#/components/responses/NotModified" }
  /groups/{group}:
    get:
      operationId: getGroup
      summary: One group with its repositories
      parameters:
        - { name: group, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The group
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos:
    get:
      operationId: listRepos
      summary: All repositories sorted by address, optionally of one group
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The repositories
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}:
    get:
      operationId: getRepo
      summary: One repository; an old address redirects to the current one
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The repository
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/docs:
    get:
      operationId: listDocs
      summary: The repository's documents, README first, then docs/ in navigation order
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The documents
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/docs/{docId}:
    get:
      operationId: getDoc
      summary: One rendered document
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, description: "The repository path, percent-encoded into one segment (docs%2Fsetup.md); the path without its extension also matches",
            schema: { type: string } }
      responses:
        "200":
          description: The document
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doc" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/manifests:
    get:
      operationId: getManifests
      summary: The repository's package manifests, the technology they state and its internal dependencies
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The manifests
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifests" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/history:
    get:
      operationId: getHistory
      summary: The repository's stored history in graph order, one page at a time
      description: |
        The default branch (its latest 500 commits) and the commits of up to 10 other branches, newest first by commit time with a
        parent never before its child. `ref` keeps the commits reachable from a branch or tag; `author`, `q` and `automation=false`
        filter further and mark the page `filtered`, which draws no graph. Pages are numbered from 1, `limit` commits each; `at`
        (a SHA or its prefix) answers the page holding that commit instead of `page`, and names it in `at`. Each commit of an
        unfiltered page carries its row of the git graph, laid out over the whole history (or what `ref` reaches), so every page
        draws on from the one before.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: ref, in: query, required: false, description: A branch or tag of the history, schema: { type: string } }
        - { name: author, in: query, required: false, description: Login or name, case-insensitive, schema: { type: string } }
        - { name: q, in: query, required: false, description: "Text in the subject or body, or a SHA prefix", schema: { type: string, maxLength: 200 } }
        - { name: automation, in: query, required: false, description: "false leaves out commits made by automation", schema: { type: boolean, default: true } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: at, in: query, required: false, description: "A SHA or a prefix of at least 4 hex digits: the page holding it", schema: { type: string, pattern: "^[0-9a-fA-F]{4,40}$" } }
      responses:
        "200":
          description: One page of the history
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pages/{page}:
    get:
      operationId: getPage
      summary: A page's layout, its elements resolved against the viewer's view
      description: |
        The elements an admin arranged in the design mode (design/layout.md), or the built-in layout when none is stored. Groups the
        viewer cannot see, or that have no repository the viewer can see, are left out; an element whose groups are all left out is
        left out.
      parameters:
        - { name: page, in: path, required: true, schema: { type: string, enum: [dashboard, present] } }
      responses:
        "200":
          description: The page's layout
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageLayout" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rules:
    get:
      operationId: getRules
      summary: The rules the portal judges by, in their current terms
      description: |
        What the pages need to explain the signals as the server applies them: the window of the activity counts, the health levels
        and the scores they start at, the severities of findings, the activities and the ages they cover, and every kind of finding
        with its name, why it matters and when it costs how much. A page names a kind it does not know by these.
      responses:
        "200":
          description: The rules
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
        "304": { $ref: "#/components/responses/NotModified" }
  /snapshot:
    get:
      operationId: getSnapshot
      summary: Data health; the web UI reads it to learn about new data
      responses:
        "200":
          description: The current snapshot
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInfo" }
        "304": { $ref: "#/components/responses/NotModified" }
  /me:
    get:
      operationId: getMe
      summary: The viewer, its roles and how one signs in
      description: |
        Who the request comes from, as the trusted proxy, the session or a bearer token names it, and what that admits: private
        repositories, the admin surfaces. `signIn` says which ways of signing in the portal offers. Never cached by a shared cache.
      responses:
        "200":
          description: The viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /assistant:
    get:
      operationId: getAssistant
      summary: Whether the assistant is on and the viewer may ask it
      responses:
        "200":
          description: The assistant's state for this viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
  /assistant/chat:
    post:
      operationId: chatAssistant
      summary: Ask the assistant; the answer streams as server-sent events
      description: |
        The conversation so far, oldest first, ending with the viewer's question. The answer is a `text/event-stream` of `text`
        (`{"text"}`, a piece of the answer), `tool` (`{"name", "label"}`, a lookup it makes), then `done` (`{"usage": {"input",
        "output"}}`) or `error` (`{"code", "message"}`), with a comment line every 15 s. The assistant only reads the catalogue, as the
        viewer sees it. A cookie-carrying request must come from the portal's own pages. Served outside the generated handlers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantChat" }
      responses:
        "200":
          description: The answer as an event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /search:
    get:
      operationId: search
      summary: Search what the portal holds, best first, one page at a time
      description: |
        Searches the viewer's view: repositories, groups, document sections, manifests (`dep`), packages and default-branch commits,
        not source code. `q` is words (all required), "phrases", -exclusions, OR between two words and filters `in:` (kinds,
        comma-separated), `group:`, `repo:`, `lang:`, `topic:`, `lifecycle:`, `author:`, `kind:` (hand, ai, automation), `dep:`,
        `before:` and `after:` (dates); the last word also matches as a prefix, and a word of five letters or more that nothing holds
        is searched within one edit (`corrections`). At most 1,000 hits are kept; `counts` gives every kind's, `in` narrows the page
        to one. Titles and snippets are plain text in parts, the matches flagged.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: in, in: query, required: false, description: "One kind's hits on the page; the counts stay every kind's", schema: { $ref: "#/components/schemas/SearchKind" } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: One page of hits
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /search/suggest:
    get:
      operationId: suggest
      summary: Up to 8 repositories, groups and documents whose names or titles start with the words, for a search box
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
      responses:
        "200":
          description: The suggestions, best first
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestions" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /tools:
    get:
      operationId: listTools
      summary: The read-only tools agents call, the same for every viewer
      description: |
        The catalogue the assistant, MCP (`/mcp`) and WebMCP call. Each tool has a name, a title, a description for a model, the JSON
        Schema of its input and its annotations: every tool only reads, and what it returns holds text repositories wrote.
      responses:
        "200":
          description: The tools in their order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolList" }
  /tools/{name}:
    post:
      operationId: callTool
      summary: Call a tool; it answers from the viewer's view
      description: |
        The tool's input as `{"input": {...}}` (16 KiB at most). The answer's `text` is Markdown framed in
        `<untrusted-content id="…">` tags: what repositories wrote is data, never instructions. A tool that cannot answer (an unknown
        repository) says why in `text` with `isError`. A cookie-carrying request must come from the portal's own pages. Served outside
        the generated handlers.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolCall" }
      responses:
        "200":
          description: What the tool read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/Problem" }
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent events announcing every new snapshot
      description: |
        A `text/event-stream` that sends `event: snapshot` with the SnapshotInfo of the caller's view when it opens and whenever a
        snapshot with another version is published, a comment line every 25 s and `retry: 5000`. Served outside the generated
        handlers; at most 1,000 streams per instance.
      responses:
        "200":
          description: The event stream; each event's data is a SnapshotInfo
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Too many streams; poll /snapshot instead
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  parameters:
    Work:
      name: work
      in: query
      required: false
      style: form
      explode: false
      description: >-
        The work that counts (the reader's lens), comma-separated kinds: hand (people's commits with no trace of an AI), ai (an AI
        co-author or a coding agent) and automation (CI, dependency and release bots, and sweeps). /dashboard counts every kind
        without it, as /commits lists every commit
      schema: { $ref: "#/components/schemas/Work" }
    PageNumber:
      name: page
      in: query
      required: false
      description: The page, from 1
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
  headers:
    ETag:
      description: Weak validator of the response body
      schema: { type: string }
  responses:
    NotModified:
      description: The representation matches If-None-Match
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Moved:
      description: The repository was renamed or transferred
      headers:
        Location:
          required: true
          schema: { type: string }
    BadRequest:
      description: The parameters are not valid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: A problem (its code says which)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    SearchKind:
      type: string
      enum: [repo, group, doc, dep, package, commit, pull, issue, release]
    TextPart:
      type: object
      required: [text]
      properties:
        text: { type: string }
        mark: { type: boolean, description: The part matched the query }
    SearchHit:
      type: object
      required: [kind, title, url, snippet]
      properties:
        kind: { $ref: "#/components/schemas/SearchKind" }
        title: { type: array, items: { $ref: "#/components/schemas/TextPart" } }
        repo: { type: string, description: "The repository's address owner/name; absent for a group" }
        url: { type: string, description: The portal page the hit opens, a path }
        snippet: { type: array, items: { $ref: "#/components/schemas/TextPart" }, description: "Up to 240 characters around the first match, one line" }
        at: { type: string, format: date-time, description: "When it happened (a commit)" }
    SearchCounts:
      type: object
      required: [repo, group, doc, dep, package, commit, pull, issue, release]
      properties:
        repo: { type: integer }
        group: { type: integer }
        doc: { type: integer }
        dep: { type: integer }
        package: { type: integer }
        commit: { type: integer }
        pull: { type: integer, description: Open pull requests }
        issue: { type: integer, description: Open issues }
        release: { type: integer, description: Releases held }
    SearchCorrection:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    SearchResult:
      type: object
      required: [query, counts, corrections, hits, page]
      properties:
        query: { type: string, description: The query as searched, trimmed }
        counts: { $ref: "#/components/schemas/SearchCounts" }
        corrections: { type: array, items: { $ref: "#/components/schemas/SearchCorrection" } }
        hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        page: { $ref: "#/components/schemas/Page" }
    Suggestions:
      type: object
      required: [hits]
      properties:
        hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
    ToolList:
      type: object
      required: [tools]
      properties:
        tools: { type: array, items: { $ref: "#/components/schemas/Tool" } }
    Tool:
      type: object
      required: [name, title, description, inputSchema, annotations]
      properties:
        name: { type: string, description: "The tool's name: a-z, 0-9 and _" }
        title: { type: string, description: For people }
        description: { type: string, description: For a model }
        inputSchema: { type: object, additionalProperties: true, description: The JSON Schema of the tool's input, an object }
        annotations: { $ref: "#/components/schemas/ToolAnnotations" }
    ToolAnnotations:
      type: object
      required: [readOnly, untrustedContent]
      properties:
        readOnly: { type: boolean, description: The tool changes nothing (every tool) }
        untrustedContent: { type: boolean, description: What it returns holds text repositories wrote (every tool) }
    ToolCall:
      type: object
      required: [input]
      properties:
        input: { type: object, additionalProperties: true }
    ToolResult:
      type: object
      required: [source, text, isError]
      properties:
        source: { type: string, description: "The portal path the tool read, such as /repos/acme/core; empty on an error" }
        text: { type: string, description: Markdown framed as untrusted content, or why the tool could not answer }
        isError: { type: boolean }
    Freshness:
      type: object
      required: [status, fetchedAt, checkedAt]
      properties:
        status: { type: string, enum: [fresh, stale, unknown, error] }
        fetchedAt: { type: [string, "null"], format: date-time, description: Last time the content was read }
        checkedAt: { type: [string, "null"], format: date-time, description: Last time the content was confirmed }
    Repo:
      type: object
      required: [address, owner, name, description, htmlUrl, homepage, defaultBranch, license, visibility, topics, archived, fork,
                 stars, openIssues, openIssuesWithPulls, openPulls, pushedAt, lastCommitAt, lastAuthoredAt, release, packages, language, groups, health, freshness]
      properties:
        address: { type: string, description: "Lower-case owner/name, used in URLs" }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        htmlUrl: { type: string }
        homepage: { type: string, description: Empty when not set }
        defaultBranch: { type: string }
        license: { type: string, description: SPDX id; empty when unknown }
        visibility: { type: string }
        topics: { type: array, items: { type: string } }
        archived: { type: boolean }
        fork: { type: boolean }
        stars: { type: integer }
        openIssues: { type: integer, description: "Open issues, the best count held: the issues read, else GitHub's count less the open pull requests read, else GitHub's count of both (openIssuesWithPulls)" }
        openIssuesWithPulls: { type: boolean, description: "openIssues counts the open pull requests too: neither is read (switched off, or not yet)" }
        openPulls: { type: [integer, "null"], description: Open pull requests; null until read }
        pushedAt: { type: string, format: date-time }
        lastCommitAt: { type: [string, "null"], format: date-time, description: The newest default-branch commit; null until read }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "The newest default-branch commit of people's work (by hand or with AI), not automation (bots, release plugins) or a sweep; when no read commit is, the oldest read one (people's is older); null until read" }
        release: { oneOf: [{ $ref: "#/components/schemas/Release" }, { type: "null" }], description: The latest release; null when there is none or it is not read yet }
        packages: { type: array, items: { $ref: "#/components/schemas/Package" }, description: "The packages it publishes to a registry with their newest release, the newest first; empty when none is known" }
        language: { type: string, description: Language of the first package manifest; empty when there is none }
        groups: { type: array, items: { type: string }, description: Group ids in configuration order }
        health: { oneOf: [{ $ref: "#/components/schemas/Health" }, { type: "null" }], description: Null for an archived or deprecated repository }
        freshness: { $ref: "#/components/schemas/Freshness" }
    HealthLevel: { type: string, enum: [good, watch, attention], description: "Where each starts is in /rules" }
    ActivityLevel: { type: string, enum: [active, recent, quiet, dormant, archived], description: "How recently the work that counts changed a repository; the ages are in /rules" }
    Rules:
      type: object
      required: [windowDays, levels, severities, activity, findings, features]
      properties:
        windowDays: { type: integer, description: The days the activity counts cover }
        features:
          type: object
          description: "The parts an operator may switch off (features in scp.yaml); a switched-off one has no pages, data, tools or findings"
          required: [pulls, issues]
          properties:
            pulls: { type: boolean, description: The open pull requests }
            issues: { type: boolean, description: The open issues }
        levels: { type: array, items: { $ref: "#/components/schemas/LevelRule" } }
        severities: { type: array, items: { $ref: "#/components/schemas/SeverityRule" } }
        activity: { type: array, items: { $ref: "#/components/schemas/ActivityRule" } }
        findings:
          type: array
          items: { $ref: "#/components/schemas/FindingKind" }
    LevelRule:
      type: object
      required: [level, label, from]
      properties:
        level: { $ref: "#/components/schemas/HealthLevel" }
        label: { type: string }
        from: { type: integer, description: The score it starts at }
    SeverityRule:
      type: object
      required: [severity, label, from]
      properties:
        severity: { type: string, enum: [high, medium, low] }
        label: { type: string }
        from: { type: integer, description: The penalty it starts at }
    ActivityRule:
      type: object
      required: [level, label, about, withinDays]
      properties:
        level: { $ref: "#/components/schemas/ActivityLevel" }
        label: { type: string }
        about: { type: string }
        withinDays: { type: [integer, "null"], description: "The age of the last change it covers; null: no bound" }
    Penalty:
      type: object
      required: [points, when]
      properties:
        points: { type: integer }
        when: { type: string }
    FindingKind:
      type: object
      required: [code, label, about, penalties, action]
      properties:
        code: { type: string }
        label: { type: string }
        about: { type: string }
        penalties: { type: array, items: { $ref: "#/components/schemas/Penalty" }, description: "When it costs how much, the most costly first" }
        action: { $ref: "#/components/schemas/FindingAction" }
    FindingAction:
      type: object
      description: The next step on a finding of this kind, on the repository's GitHub page
      required: [label, path]
      properties:
        label: { type: string, description: "What to do: Draft a release" }
        path: { type: string, description: "Below the repository's GitHub page (releases/new); empty: the page itself" }
    Finding:
      type: object
      required: [code, penalty, message]
      properties:
        code: { type: string, description: "The kind of finding; /rules names and explains every kind, so a new one needs no change here" }
        penalty: { type: integer, description: Points the finding costs }
        message: { type: string }
    Health:
      type: object
      required: [score, level, findings]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { $ref: "#/components/schemas/HealthLevel" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    RepoFinding:
      allOf:
        - $ref: "#/components/schemas/Finding"
        - type: object
          required: [repo]
          properties:
            repo: { type: string, description: Address of the repository }
    ProductHealth:
      type: object
      description: The weighted health of a group's repositories; archived and deprecated ones are not counted
      required: [score, level, counted, attention, watch, findings, findingCount]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { $ref: "#/components/schemas/HealthLevel" }
        counted: { type: integer, description: Repositories with a score }
        attention: { type: integer, description: Repositories at attention }
        watch: { type: integer, description: Repositories at watch }
        findings: { type: array, items: { $ref: "#/components/schemas/RepoFinding" }, description: "Most costly first; the dashboard carries the first 5" }
        findingCount: { type: integer }
    Package:
      type: object
      required: [ecosystem, name, version, publishedAt, url, registry]
      properties:
        ecosystem: { type: string, description: "The package manager: maven, npm, ..." }
        name: { type: string, description: "group:artifact for Maven, the package name elsewhere" }
        version: { type: string, description: The newest release at the registry }
        publishedAt: { type: [string, "null"], format: date-time, description: When the registry says it was published; null when it does not say }
        url: { type: string, description: "The package at its registry, https; empty when the registry gave no address" }
        registry: { type: string, description: The configured registry's id, else the registry's host }
    Release:
      type: object
      required: [tag, url, publishedAt]
      properties:
        tag: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
    RepoDetail:
      type: object
      required: [repo, title, group, descriptor, commits, commitsFreshness]
      properties:
        repo: { $ref: "#/components/schemas/Repo" }
        group:
          oneOf: [{ $ref: "#/components/schemas/GroupRef" }, { type: "null" }]
          description: The first of its groups in configuration order, the page above it; null when it is in none
        title: { type: string, description: The descriptor title, else the repository name }
        descriptor: { $ref: "#/components/schemas/Descriptor" }
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: The latest default-branch commits }
        commitsFreshness: { $ref: "#/components/schemas/Freshness" }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Descriptor:
      type: object
      description: The repository's own scp.yaml. It changes display only.
      required: [present, file, title, description, lifecycle, owners, tags, links, problems, freshness]
      properties:
        present: { type: boolean }
        file: { type: string, description: Path of the file read; empty when none }
        title: { type: string }
        description: { type: string }
        lifecycle: { type: string, enum: ["", experimental, production, deprecated] }
        owners: { type: array, items: { type: string }, description: Claimed owners, "@user or @org/team" }
        tags: { type: array, items: { type: string } }
        links: { type: array, items: { $ref: "#/components/schemas/Link" } }
        problems: { type: array, items: { $ref: "#/components/schemas/FileProblem" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
    FileProblem:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: "JSON pointer into the file, /line/12 for a line; empty for the whole file" }
        code: { type: string }
        message: { type: string }
    Commit:
      type: object
      required: [repo, sha, subject, authorName, authorLogin, url, committedAt, parents, kind, assistant]
      properties:
        repo: { type: string, description: Repository address }
        sha: { type: string }
        subject: { type: string, description: First line of the message }
        authorName: { type: string }
        authorLogin: { type: string, description: GitHub login; empty when unknown }
        url: { type: string, description: Commit page; empty when unknown }
        committedAt: { type: string, format: date-time }
        parents:
          type: array
          items: { type: string }
          maxItems: 8
          description: SHAs of the parent commits, first parent first; empty for a root commit, two or more for a merge
        kind:
          type: string
          enum: [person, assisted, agent, automation]
          description: >-
            Who made it: a person with no trace of an AI; a person with an AI co-author (a Co-authored-by trailer or an AI tool's
            footer); a coding agent as the author; automation (CI, dependency and release bots, or a bot's pull request merged)
        assistant: { type: string, description: "The AI named by the commit, as named (\"Claude Opus 5\", \"Copilot\"); empty for none" }
        stats: { $ref: "#/components/schemas/CommitStats" }
    CommitStats:
      type: object
      description: What a commit changed (design/diffstat.md); absent on a commit older than 90 days or not asked yet
      required: [additions, deletions]
      properties:
        additions: { type: integer, minimum: 0, description: Lines added }
        deletions: { type: integer, minimum: 0, description: Lines removed }
        files: { type: integer, minimum: 0, description: Files changed; absent when GitHub does not say }
    Label:
      type: object
      required: [name, kind, sha, default]
      properties:
        name: { type: string }
        kind: { type: string, enum: [branch, tag] }
        sha: { type: string, description: The commit it points at }
        default: { type: boolean, description: The default branch }
    HistoryCommit:
      allOf:
        - $ref: "#/components/schemas/Commit"
        - type: object
          required: [body, committerName, automated, labels, beyond, graph]
          properties:
            body: { type: string, description: The message after its subject line; empty when there is none }
            committerName: { type: string }
            automated: { type: boolean, description: "Made by automation: kind automation" }
            labels: { type: array, items: { $ref: "#/components/schemas/Label" }, description: "The branches and tags at this commit, the default branch first" }
            beyond: { type: array, items: { type: string }, description: The parents older than the stored history }
            graph: { oneOf: [{ $ref: "#/components/schemas/GraphRow" }, { type: "null" }], description: "The commit's row of the git graph; null on a filtered page" }
    GraphEdge:
      type: object
      description: A line through a row, from a lane at its top (or its node) to a lane at its bottom (or its node)
      required: [from, to, color, open]
      properties:
        from: { type: integer }
        to: { type: integer }
        color: { type: integer, description: "The lane's colour, 0 to 5" }
        open: { type: boolean, description: The line leads to a parent older than the stored history }
    GraphRow:
      type: object
      description: "How a commit's row of the git graph draws, like git log --graph: its node, the lines in from above and out below. Lanes never shift; draw at most 8, a lane beyond them in the last"
      required: [lane, color, merge, above, below]
      properties:
        lane: { type: integer }
        color: { type: integer, description: "0 to 5" }
        merge: { type: boolean }
        above: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        below: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
    HistoryPage:
      type: object
      required: [commits, labels, filtered, lanes, at, page, freshness]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/HistoryCommit" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" }, description: Every branch and tag of the history }
        filtered: { type: boolean, description: "author, q or automation left commits out: the page is a list, not a graph" }
        lanes: { type: integer, description: "The graph's width over this page's rows, at most 8; 0 on a filtered page" }
        at: { type: [string, "null"], description: "The commit `at` named, when it is on this page" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    PrerequisiteList:
      type: object
      required: [unmet]
      properties:
        unmet: { type: array, items: { $ref: "#/components/schemas/Prerequisite" } }
    Prerequisite:
      type: object
      required: [feature, title, effect]
      properties:
        feature: { type: string, enum: [catalogue, pulls, issues] }
        title: { type: string }
        effect: { type: string, description: What a reader sees without it }
        source: { type: string, description: "The configured source; administrators only" }
        owners: { type: array, items: { type: string }, description: "The accounts whose installation lacks it; administrators only" }
        permissions: { type: array, items: { type: string }, description: "The missing read permissions as GitHub's settings name them; administrators only" }
        events: { type: array, items: { type: string }, description: "The missing webhook events as GitHub's settings name them; administrators only" }
        refused: { type: boolean, description: "A token GitHub refused, whose permissions cannot be asked; administrators only" }
        fix: { type: string, description: "What to do about it; administrators only" }
    QueueSort:
      type: string
      enum: [waiting, newest, updated]
      default: waiting
      description: "The order of a list of open pull requests or issues: whose turn first (waiting), newest first, updated last first"
    IssueState:
      type: string
      enum: [triage, unassigned, assigned]
      description: >-
        Where an issue stands, the first that holds: assigned (someone has it); triage (no label, milestone or issue type: a
        maintainer has not looked at it); unassigned (triaged, nobody took it)
    IssueKind:
      type: string
      enum: [bug, feature, question, other]
      description: "GitHub's issue type when set, else read from the labels"
    Issue:
      type: object
      required: [repo, number, title, url, author, bot, createdAt, updatedAt, labels, assignees, assigned, comments, state, kind]
      properties:
        repo: { type: string, description: Repository address }
        number: { type: integer }
        title: { type: string }
        url: { type: string, description: The issue on GitHub }
        author: { type: string, description: GitHub login }
        bot: { type: boolean, description: "Opened by automation (Renovate's dependency dashboard, a [bot] or bot-like login)" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: The last activity }
        labels: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/IssueLabel" } }
        assignees: { type: array, maxItems: 3, items: { type: string }, description: The first assignees' logins }
        assigned: { type: integer, description: Every assignee counted }
        comments: { type: integer }
        milestone: { type: string, description: "The milestone's title; absent when none" }
        type: { type: string, description: "GitHub's issue type; absent when none" }
        state: { $ref: "#/components/schemas/IssueState" }
        kind: { $ref: "#/components/schemas/IssueKind" }
    IssueCounts:
      type: object
      description: Open issues by state, kind and by whom
      required: [open, people, automation, states, kinds, oldestTriage]
      properties:
        open: { type: integer }
        people: { type: integer }
        automation: { type: integer }
        states:
          type: object
          required: [triage, unassigned, assigned]
          properties:
            triage: { type: integer }
            unassigned: { type: integer }
            assigned: { type: integer }
        kinds:
          type: object
          required: [bug, feature, question, other]
          properties:
            bug: { type: integer }
            feature: { type: integer }
            question: { type: integer }
            other: { type: integer }
        oldestTriage: { type: [string, "null"], format: date-time, description: "When the person's issue waiting longest for triage was opened; null when none waits" }
    IssuePage:
      type: object
      required: [issues, counts, page, freshness]
      properties:
        issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
        counts: { $ref: "#/components/schemas/IssueCounts" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    PullState:
      type: string
      enum: [draft, conflicts, failing, changes, review, checks, ready, unknown]
      description: >-
        Whose turn a pull request is, the first that holds: draft, conflicts (it does not merge), failing (its checks) and changes
        (a reviewer asked) wait for the author; review (a review is required, or none approved yet) for reviewers; checks (running)
        for CI; ready (approved or no review required, checks passing) for a maintainer to merge; unknown until GitHub's state is read
    PullRequest:
      type: object
      required: [repo, number, title, url, author, bot, draft, fork, createdAt, updatedAt, base, head, labels, requested, state, waitsFor, checks]
      properties:
        repo: { type: string, description: Repository address }
        number: { type: integer }
        title: { type: string }
        url: { type: string, description: The pull request on GitHub }
        author: { type: string, description: GitHub login }
        bot: { type: boolean, description: "Opened by automation (Dependabot, Renovate, a [bot] or bot-like login)" }
        draft: { type: boolean }
        fork: { type: boolean, description: From another repository }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: The last activity }
        base: { type: string, description: The branch it merges into }
        head: { type: string, description: Its branch }
        labels: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/IssueLabel" } }
        requested: { type: integer, description: Reviewers and teams asked for a review }
        state: { $ref: "#/components/schemas/PullState" }
        waitsFor: { type: string, enum: [author, reviewers, ci, maintainer, unknown] }
        checks: { type: string, enum: [passing, failing, running, none], description: "The head commit's checks" }
        stats: { $ref: "#/components/schemas/CommitStats" }
    IssueLabel:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string, description: "Six hex digits; empty when unknown" }
    PullCounts:
      type: object
      description: Open pull requests by state and by whom
      required: [open, people, automation, states, oldestReview]
      properties:
        open: { type: integer, description: Every open pull request counted, drafts included }
        people: { type: integer }
        automation: { type: integer }
        states:
          type: object
          required: [draft, conflicts, failing, changes, review, checks, ready, unknown]
          properties:
            draft: { type: integer }
            conflicts: { type: integer }
            failing: { type: integer }
            changes: { type: integer }
            review: { type: integer }
            checks: { type: integer }
            ready: { type: integer }
            unknown: { type: integer }
        oldestReview: { type: [string, "null"], format: date-time, description: "The last activity of the person's pull request that waits longest for a review; null when none waits" }
    PullPage:
      type: object
      required: [pulls, counts, page, freshness]
      properties:
        pulls: { type: array, items: { $ref: "#/components/schemas/PullRequest" } }
        counts: { $ref: "#/components/schemas/PullCounts" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    ReleaseVariant: { type: string, enum: [latest, all, stable, pre], description: "latest: one row per repository, its newest stable release (default); all; stable; pre" }
    ReleaseSource: { type: string, enum: [all, github, packages], description: "all: GitHub releases and published packages (default); github; packages (the newest release of each package a repository publishes)" }
    ReleaseSort: { type: string, enum: [newest, oldest, repo, group], description: "newest first (default); oldest first; by repository; by product, then newest" }
    ReleaseEntry:
      type: object
      required: [repo, name, groups, source, package, tag, title, summary, url, publishedAt, prerelease, author, bot, assets, notes, notesCut, notesFrom]
      properties:
        repo: { type: string, description: "Lower-case owner/name, used in URLs" }
        name: { type: string, description: The repository's name }
        groups: { type: array, items: { type: string }, description: Group ids in configuration order }
        source: { type: string, description: "github for a GitHub release, else the package manager's ecosystem (maven, npm, pypi, cargo, go, swift, cocoapods, nuget, rubygems, packagist)" }
        package: { type: string, description: The package's name; empty for a GitHub release }
        tag: { type: string, description: "The release's tag; a package's version" }
        title: { type: string, description: "The release's name; empty when it has none" }
        summary: { type: string, description: "The first line of its notes, cleaned; empty when it has none" }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
        prerelease: { type: boolean }
        author: { type: string, description: Empty when GitHub names none }
        bot: { type: boolean, description: Published by automation }
        assets: { type: integer }
        notes: { type: string, description: "The release's notes as sanitised HTML (headings as bold paragraphs, images as their alt text); empty when it has none" }
        notesCut: { type: boolean, description: The notes were cut; the rest is on the release's page }
        notesFrom: { type: string, enum: ["", release, changelog], description: "release: the GitHub release's own notes; changelog: the section of the repository's changelog for the version; empty with no notes" }
    ReleaseCounts:
      type: object
      required: [latest, all, stable, pre, github, packages]
      properties:
        latest: { type: integer, description: "Repositories with a stable release of the chosen source" }
        all: { type: integer }
        stable: { type: integer }
        pre: { type: integer }
        github: { type: integer, description: "The rows the chosen variant lists that are GitHub releases" }
        packages: { type: integer, description: "The rows the chosen variant lists that are published packages" }
    ReleasePage:
      type: object
      required: [releases, counts, page, freshness]
      properties:
        releases: { type: array, items: { $ref: "#/components/schemas/ReleaseEntry" } }
        counts: { $ref: "#/components/schemas/ReleaseCounts" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    InsightThresholds:
      type: object
      required: [months, releases, singleAuthorShare, singleAuthorCommits, sharedLibraries]
      properties:
        months: { type: integer, description: Months of releases counted }
        releases: { type: integer, description: "Stable releases a product's median interval reads" }
        singleAuthorShare: { type: integer, description: "Percent of people's commits one author wrote" }
        singleAuthorCommits: { type: integer, description: "People's commits that must be held" }
        sharedLibraries: { type: integer, description: Libraries listed }
    InsightMonth:
      type: object
      required: [month, releases]
      properties:
        month: { type: string, description: "YYYY-MM (UTC)" }
        releases: { type: integer }
    InsightProduct:
      type: object
      required: [group, name, releases, weekly]
      properties:
        group: { type: string }
        name: { type: string }
        releases: { type: integer, description: Stable releases held across the product }
        medianDays: { type: [integer, "null"], description: "Median days between its last stable releases; null with fewer than two" }
        last: { type: [string, "null"], format: date-time, description: Its newest stable release }
        weekly: { type: array, items: { type: integer }, description: "Stable releases of each of the last 52 weeks, oldest first (the week starts on Monday, UTC)" }
    InsightCount:
      type: object
      required: [name, repos, share]
      properties:
        name: { type: string }
        repos: { type: integer }
        share: { type: number, description: "Of the repositories in scope, 0 to 1" }
    InsightVersion:
      type: object
      required: [version, repos]
      properties:
        version: { type: string, description: The version as a manifest states it }
        repos: { type: integer }
    InsightRuntime:
      type: object
      required: [name, repos, oldest, newest, versions]
      properties:
        name: { type: string, description: "go, node or java" }
        repos: { type: integer }
        oldest: { type: string }
        newest: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/InsightVersion" }, description: "Every version named, oldest first" }
    InsightLibrary:
      type: object
      required: [repo, dependants, dependantRepos]
      properties:
        repo: { type: string, description: owner/name }
        dependants: { type: integer, description: Live repositories that depend on it }
        dependantRepos: { type: array, items: { type: string }, description: The first ten }
        release: { type: [string, "null"], description: Its latest stable release }
        retired: { $ref: "#/components/schemas/ArchiveReason" }
    InsightMatrixRow:
      type: object
      required: [repo, uses]
      properties:
        repo: { type: string, description: owner/name }
        uses: { type: array, items: { type: integer }, description: Indexes into the matrix's libraries that this repository depends on }
    InsightMatrix:
      type: object
      required: [libraries, repos]
      properties:
        libraries: { type: array, items: { type: string }, description: The listed libraries, most dependants first }
        repos: { type: array, items: { $ref: "#/components/schemas/InsightMatrixRow" }, description: "The repositories using most of them, at most 24" }
    InsightBand:
      type: object
      required: [from, to, repos]
      properties:
        from: { type: integer, description: Percent, inclusive }
        to: { type: integer, description: "Percent, exclusive except for the last band" }
        repos: { type: integer }
    InsightRepo:
      type: object
      required: [repo, commits]
      properties:
        repo: { type: string, description: owner/name }
        commits: { type: integer, description: "People's commits held" }
    InsightDormant:
      type: object
      required: [repo, lastChange]
      properties:
        repo: { type: string, description: owner/name }
        lastChange: { type: [string, "null"], format: date-time }
    InsightActivity:
      type: object
      required: [group, name, active, recent, quiet, dormant]
      properties:
        group: { type: string }
        name: { type: string }
        active: { type: integer }
        recent: { type: integer }
        quiet: { type: integer }
        dormant: { type: integer }
    InsightAgeing:
      type: object
      required: [active, recent, quiet, dormant, dormantRepos, products]
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/InsightActivity" }, description: Each product's repositories by activity }
        active: { type: integer }
        recent: { type: integer }
        quiet: { type: integer }
        dormant: { type: integer }
        dormantRepos: { type: array, items: { $ref: "#/components/schemas/InsightDormant" }, description: The longest dormant first, at most 50 }
    InsightCadence:
      type: object
      required: [months, products]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/InsightMonth" }, description: The last months, oldest first }
        products: { type: array, items: { $ref: "#/components/schemas/InsightProduct" } }
    InsightTechnology:
      type: object
      required: [languages, buildTools, runtimes, unknown]
      properties:
        languages: { type: array, items: { $ref: "#/components/schemas/InsightCount" } }
        buildTools: { type: array, items: { $ref: "#/components/schemas/InsightCount" } }
        runtimes: { type: array, items: { $ref: "#/components/schemas/InsightRuntime" } }
        unknown: { type: integer, description: Repositories whose manifests name no language }
    Insights:
      type: object
      required: [repos, thresholds, cadence, technology, libraries, matrix, singleAuthor, concentration, ageing, freshness]
      properties:
        repos: { type: integer, description: Repositories in scope, retired ones left out }
        thresholds: { $ref: "#/components/schemas/InsightThresholds" }
        cadence: { $ref: "#/components/schemas/InsightCadence" }
        technology: { $ref: "#/components/schemas/InsightTechnology" }
        libraries: { type: array, items: { $ref: "#/components/schemas/InsightLibrary" } }
        matrix: { $ref: "#/components/schemas/InsightMatrix" }
        concentration: { type: array, items: { $ref: "#/components/schemas/InsightBand" }, description: "How much of the people's recent commits the busiest author wrote, in ten bands, over the repositories with enough commits held" }
        singleAuthor: { type: array, items: { $ref: "#/components/schemas/InsightRepo" } }
        ageing: { $ref: "#/components/schemas/InsightAgeing" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    ArchiveReason: { type: string, enum: [archived, deprecated], description: "Archived on GitHub, or `lifecycle: deprecated` in scp.yaml" }
    ArchiveSort: { type: string, enum: [active, name, group, used], description: "active: last active first (default); name; group; used: most dependants first" }
    ArchiveEntry:
      type: object
      required: [repo, reason, lastActive, usedBy, authors]
      properties:
        repo: { $ref: "#/components/schemas/Repo" }
        reason: { $ref: "#/components/schemas/ArchiveReason" }
        lastActive: { type: string, format: date-time, description: "The newest default-branch commit the portal holds, else the last push" }
        usedBy: { type: integer, description: "Other repositories whose manifests still depend on a package it provides; archived ones are not counted" }
        authors: { type: integer, description: "Authors of its newest default-branch commits, people's work only; counted, never named" }
    ArchiveCounts:
      type: object
      required: [total, archived, deprecated, used]
      properties:
        total: { type: integer }
        archived: { type: integer }
        deprecated: { type: integer }
        used: { type: integer, description: Those another repository still depends on }
    ArchivePage:
      type: object
      required: [archive, counts, page, freshness]
      properties:
        archive: { type: array, items: { $ref: "#/components/schemas/ArchiveEntry" } }
        counts: { $ref: "#/components/schemas/ArchiveCounts" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    CommitPage:
      type: object
      required: [commits, page, freshness]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Page:
      type: object
      required: [number, size, total, pages]
      properties:
        number: { type: integer, description: This page, from 1 }
        size: { type: integer, description: Items per page (the limit) }
        total: { type: integer, description: Items matching the filter }
        pages: { type: integer, description: "Pages in all, at least 1" }
    FreshnessCounts:
      type: object
      description: Repositories by the freshness of their commits
      required: [fresh, stale, unknown, error]
      properties:
        fresh: { type: integer }
        stale: { type: integer }
        unknown: { type: integer }
        error: { type: integer }
    DashboardGroup:
      type: object
      required: [id, name, description, defaultRepo, repoCount, lastActivity, health, activity, members, summary, pulls]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"], description: Address of the group's main repository, whose badges the dashboard shows }
        repoCount: { type: integer }
        lastActivity: { type: [string, "null"], format: date-time, description: Time of the group's newest commit }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: Null when no repository is counted }
        activity: { $ref: "#/components/schemas/Activity" }
        members: { type: array, items: { $ref: "#/components/schemas/DashboardMember" }, description: "Every member, by address, for the fleet map" }
        summary: { $ref: "#/components/schemas/GroupSummaryFacts" }
        pulls: { $ref: "#/components/schemas/PullCounts", description: "The members' open pull requests; automation's only when the work that counts holds it" }
    Activity:
      type: object
      description: >-
        Work on the default branches. People's work is every commit not made by automation (CI, dependency and release bots) and not
        part of a sweep: a subject that landed in more than 10 repositories on one day (UTC). A coding agent's commit is people's
        work: someone set the agent to it. People's work is by hand or with an AI (an AI co-author or footer, or a coding agent as the
        author); AI use leaves no trace in some tools (inline completion), so ai is a lower bound. Automation and sweeps are
        maintenance. The counts give every kind; the people (of people's work that counts), the last change and the recent
        repositories follow the work that counts (Dashboard.work).
      required: [hand, ai, automation, sweeps, weeklyHand, weeklyAi, weeklyAutomation, authors, authorCount, assistants, lastAuthoredAt, recent]
      properties:
        hand: { type: integer, description: "People's commits by hand in the last 30 days" }
        ai: { type: integer, description: "People's commits with an AI in the last 30 days: an AI co-author, or a coding agent as the author" }
        automation: { type: integer, description: Commits by automation in the last 30 days }
        sweeps: { type: integer, description: Commits of sweeps in the last 30 days }
        weeklyHand: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: "People's commits by hand per 7 days, the oldest of the last 12 first" }
        weeklyAi: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: "People's commits with an AI per 7 days, the oldest of the last 12 first" }
        weeklyAutomation: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: "Commits by automation and of sweeps per 7 days, the oldest of the last 12 first" }
        assistants: { type: array, items: { type: string }, description: "The AI assistants of the last 30 days by family (\"Claude\", \"Copilot\"), most commits first, at most 3" }
        authors: { type: array, items: { $ref: "#/components/schemas/Person" }, description: "The people who made the work that counts in the last 30 days (automation names none), most commits first, at most 5" }
        authorCount: { type: integer, description: How many people made the work that counts in the last 30 days }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "The newest commit of the work that counts; null when none is read" }
        recent: { type: array, items: { $ref: "#/components/schemas/RecentRepo" }, description: "The repositories the work that counts changed last, at most 3" }
    Person:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "The name in the commits (the login when they carry none)" }
        login: { type: string, description: "The GitHub login, when GitHub links the commits to an account; the short form to show" }
    RecentRepo:
      type: object
      required: [repo, at]
      properties:
        repo: { type: string, description: Address }
        at: { type: string, format: date-time }
    DashboardMember:
      type: object
      required: [address, name, archived, lastAuthoredAt, level, activity]
      properties:
        activity: { $ref: "#/components/schemas/ActivityLevel" }
        address: { type: string }
        name: { type: string }
        archived: { type: boolean }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "As Repo.lastAuthoredAt, of the work that counts (Dashboard.work)" }
        level: { oneOf: [{ $ref: "#/components/schemas/HealthLevel" }, { type: "null" }], description: Null when not counted }
    GroupSummaryFacts:
      type: object
      description: What most members share, said once instead of on every repository; null where fewer than 80% share it
      required: [license, language, released]
      properties:
        license: { type: [string, "null"], description: "The licence at least 80% of the members have" }
        language: { type: [string, "null"], description: "The language at least 80% of the members have" }
        released: { type: integer, description: Members with a release }
    LayoutElement:
      type: object
      description: >-
        One block of a page. Each kind reads only its own fields: products and fleet-map take groups (absent: every group), products
        takes view, fleet-map takes color, latest-commits, pulls and issues take count, heading takes text and note (plain text).
      required: [kind]
      properties:
        kind: { type: string, enum: [telemetry, fleet-map, announcements, products, latest-commits, pulls, issues, heading] }
        groups: { type: array, items: { type: string }, minItems: 1, maxItems: 100, description: Group ids in display order }
        view: { type: string, enum: [cards, table, tiles], description: "How products are drawn until the reader switches; tiles: compact, for the presentation page" }
        color: { type: string, enum: [activity, health], description: "What colours the fleet map's tiles: the last change's age (the default) or the health level" }
        count: { type: integer, minimum: 1, maximum: 50, description: How many commits or pull requests }
        text: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 500 }
    PageLayout:
      type: object
      required: [page, elements, stored, announcements]
      properties:
        page: { type: string }
        elements: { type: array, items: { $ref: "#/components/schemas/LayoutElement" } }
        stored: { type: boolean, description: "An admin's layout; false: the built-in one" }
        announcements:
          type: array
          maxItems: 3
          description: The announcements this viewer may see on this page now, in display order; the announcements element places them
          items: { $ref: "#/components/schemas/Announcement" }
    Announcement:
      type: object
      description: >-
        A short notice from the portal's admins or its deployment (design/announcements.md): plain text, one https link, a tone. Times
        keep the offset they were written with and are shown as written.
      required: [id, revision, title, tone, until]
      properties:
        id: { type: string }
        revision: { type: string, description: "The digest of its fields: a reader's dismissal holds for this revision" }
        title: { type: string, maxLength: 80 }
        text: { type: string, maxLength: 280 }
        tone: { type: string, enum: [notice, event, info] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        place: { type: string, maxLength: 80 }
        link: { $ref: "#/components/schemas/AnnouncementLink" }
        lang: { type: string, description: "The language of its text, a BCP 47 tag" }
        until: { type: string, format: date-time, description: Shown until this time }
        qr: { $ref: "#/components/schemas/QRCode" }
    AnnouncementLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 40 }
        url: { type: string, format: uri }
    QRCode:
      type: object
      description: "The link as a QR code: an SVG path over a square of size modules, the quiet zone not included"
      required: [size, path]
      properties:
        size: { type: integer }
        path: { type: string }
    Work:
      type: array
      items: { $ref: "#/components/schemas/WorkKind" }
      minItems: 1
      maxItems: 3
      uniqueItems: true
      description: "The work that counts: one or more kinds"
    WorkKind:
      type: string
      enum: [hand, ai, automation]
      description: "A kind of work: people's by hand, people's with an AI, or maintenance by automation (bots and sweeps)"
    Dashboard:
      type: object
      required: [work, groups, repoCount, ungroupedCount, latest, health, freshness, activity, pulls]
      properties:
        work: { $ref: "#/components/schemas/Work" }
        groups: { type: array, items: { $ref: "#/components/schemas/DashboardGroup" } }
        activity: { $ref: "#/components/schemas/Activity" }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: "Every repository weighed as one product; the first 5 findings" }
        repoCount: { type: integer }
        ungroupedCount: { type: integer, description: Repositories in no group }
        latest: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: "The 10 newest commits of the work that counts (Dashboard.work); /commits lists all of them" }
        freshness: { $ref: "#/components/schemas/FreshnessCounts" }
        pulls: { $ref: "#/components/schemas/PullCounts", description: "Every open pull request of the view; automation's only when the work that counts holds it" }
    DocSummary:
      type: object
      required: [id, path, readme, title, description, format, state, truncated]
      properties:
        id: { type: string, description: Path parameter of the document }
        path: { type: string }
        readme: { type: boolean }
        title: { type: string }
        description: { type: string }
        format: { type: string, enum: [markdown, text] }
        state: { type: string, enum: [ok, too_large, unsupported], description: too_large and unsupported have no HTML }
        truncated: { type: boolean, description: Only the first part of the file is rendered }
    DocList:
      type: object
      required: [docs, freshness]
      properties:
        docs: { type: array, items: { $ref: "#/components/schemas/DocSummary" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Heading:
      type: object
      required: [level, id, text]
      properties:
        level: { type: integer, minimum: 2, maximum: 3 }
        id: { type: string }
        text: { type: string }
    Doc:
      type: object
      required: [id, path, readme, title, description, format, state, truncated, html, toc, blobSha, sourceUrl, freshness]
      properties:
        id: { type: string }
        path: { type: string }
        readme: { type: boolean }
        title: { type: string }
        description: { type: string }
        format: { type: string, enum: [markdown, text] }
        state: { type: string, enum: [ok, too_large, unsupported] }
        truncated: { type: boolean }
        html: { type: string, description: Sanitised HTML }
        toc: { type: array, items: { $ref: "#/components/schemas/Heading" } }
        blobSha: { type: string }
        sourceUrl: { type: string, description: The file on GitHub }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Manifests:
      type: object
      required: [technology, manifests, uses, usedBy, freshness]
      properties:
        technology: { $ref: "#/components/schemas/Technology" }
        manifests: { type: array, items: { $ref: "#/components/schemas/Manifest" }, description: By path }
        uses: { type: array, items: { $ref: "#/components/schemas/RepoLink" }, description: Catalogued repositories this one depends on }
        usedBy: { type: array, items: { $ref: "#/components/schemas/RepoLink" }, description: Catalogued repositories that depend on this one }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Technology:
      type: object
      required: [languages, buildTools, toolchains]
      properties:
        languages: { type: array, items: { type: string } }
        buildTools: { type: array, items: { type: string } }
        toolchains: { type: array, items: { $ref: "#/components/schemas/ToolchainVersions" } }
    ToolchainVersions:
      type: object
      required: [name, versions]
      properties:
        name: { type: string, enum: [go, node, java, rust, python] }
        versions: { type: array, items: { type: string }, description: Every version the manifests state }
    Manifest:
      type: object
      required: [path, ecosystem, name, version, language, buildTool, toolchain, dependencies, problems]
      properties:
        path: { type: string }
        ecosystem: { type: string, enum: [go, npm, maven, cargo, pypi] }
        name: { type: string, description: "Go module path, npm package name, Maven groupId:artifactId, crate or Python project name; empty when the file names none" }
        version: { type: string }
        language: { type: string }
        buildTool: { type: string }
        toolchain: { type: array, items: { $ref: "#/components/schemas/Toolchain" } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/Dependency" } }
        problems: { type: array, items: { $ref: "#/components/schemas/FileProblem" } }
    Toolchain:
      type: object
      required: [name, version]
      properties:
        name: { type: string, enum: [go, node, java, rust, python] }
        version: { type: string }
    Dependency:
      type: object
      required: [name, version, scope, repos]
      properties:
        name: { type: string }
        version: { type: string, description: The requirement as written; empty when none }
        scope: { type: string, enum: [runtime, dev, peer, optional, provided, test, indirect, tool, parent, import] }
        repos: { type: array, items: { type: string }, description: Addresses of the catalogued repositories that declare this name }
    RepoLink:
      type: object
      required: [address, owner, name, via]
      properties:
        address: { type: string }
        owner: { type: string }
        name: { type: string }
        via: { type: array, items: { type: string }, description: The dependency names that link the two repositories }
    RepoList:
      type: object
      required: [repos]
      properties:
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
    GroupSummary:
      type: object
      required: [id, name, description, defaultRepo, defaultRepoState, repoCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"], description: Address of the group's main repository }
        defaultRepoState: { type: string, enum: [ok, missing] }
        repoCount: { type: integer }
    GroupList:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/GroupSummary" } }
    Group:
      type: object
      required: [id, name, description, defaultRepo, defaultRepoState, repoCount, health, repos]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"] }
        defaultRepoState: { type: string, enum: [ok, missing] }
        repoCount: { type: integer }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: Every finding }
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
    SourceInfo:
      type: object
      required: [id, repos, freshness]
      properties:
        id: { type: string }
        repos: { type: integer }
        freshness: { $ref: "#/components/schemas/Freshness" }
    AssistantStatus:
      type: object
      additionalProperties: false
      required: [enabled, allowed, access, provider, model]
      properties:
        enabled: { type: boolean, description: The operator configured a provider }
        allowed: { type: boolean, description: This viewer may ask }
        access: { type: string, enum: [signed-in, admin, everyone], description: Who may ask }
        provider: { type: string, description: The provider; empty when off }
        model: { type: string, description: The model; empty when off }
    AssistantChat:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
    Me:
      type: object
      required: [signedIn, name, via, private, admin, signIn]
      properties:
        signedIn: { type: boolean }
        name: { type: string, description: "The viewer's name; empty when anonymous" }
        via: { type: string, enum: [none, proxy, oidc, token], description: "How the viewer is identified; none when anonymous" }
        private: { type: boolean, description: Sees private and internal repositories }
        admin: { type: boolean, description: Sees the operator surfaces }
        signIn:
          type: object
          required: [oidc, token]
          properties:
            oidc: { type: boolean, description: "GET /auth/login signs in at the provider" }
            token: { type: boolean, description: "POST /auth/token exchanges a token for a session" }
    SnapshotInfo:
      type: object
      required: [version, builtAt, ready, sources]
      properties:
        version:
          type: integer
          format: int64
          description: Identifies the content; equal on every instance for equal data. Compare for equality only.
        builtAt: { type: [string, "null"], format: date-time }
        ready: { type: boolean, description: A catalogue is loaded }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceInfo" } }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: "urn:scp:request:<request id>" }
        code: { type: string }
