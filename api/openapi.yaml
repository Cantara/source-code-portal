openapi: 3.1.0
info:
  title: Source Code Portal API
  version: "1"
  description: |
    Read API over the portal's snapshot. Lists are returned whole, except commits, which come in numbered pages. Every 200 response carries a weak ETag; send it back in
    If-None-Match to get 304 Not Modified. Errors are RFC 9457 problems.
servers:
  - url: /api/v1
paths:
  /dashboard:
    get:
      operationId: getDashboard
      summary: Groups with counts and latest activity, the latest commits and data health
      responses:
        "200":
          description: The dashboard
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "304": { $ref: "#/components/responses/NotModified" }
  /commits:
    get:
      operationId: listCommits
      summary: Default-branch commits merged across repositories, newest first, one page at a time
      description: |
        Order is committedAt descending, then repository address, then SHA. `group` and `repo` intersect. Pages are numbered from 1
        over the current snapshot, `limit` commits each; a page past the last is empty, and `page` says how many there are. New
        commits move the older ones to later pages. The freshness covers every repository in scope: fresh when all are fresh, stale
        otherwise, with the oldest times.
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: repo, in: query, required: false, description: "owner/name", schema: { type: string } }
        - { name: automation, in: query, required: false, description: "false leaves out commits made by automation", schema: { type: boolean, default: true } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page of commits
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups:
    get:
      operationId: listGroups
      summary: All groups in configuration order, with member counts
      responses:
        "200":
          description: The groups
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupList" }
        "304": { $ref: "#/components/responses/NotModified" }
  /groups/{group}:
    get:
      operationId: getGroup
      summary: One group with its repositories
      parameters:
        - { name: group, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The group
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos:
    get:
      operationId: listRepos
      summary: All repositories sorted by address, optionally of one group
      parameters:
        - { name: group, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The repositories
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}:
    get:
      operationId: getRepo
      summary: One repository; an old address redirects to the current one
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The repository
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/docs:
    get:
      operationId: listDocs
      summary: The repository's documents, README first, then docs/ in navigation order
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The documents
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/docs/{docId}:
    get:
      operationId: getDoc
      summary: One rendered document
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: docId, in: path, required: true, description: "The repository path, percent-encoded into one segment (docs%2Fsetup.md); the path without its extension also matches",
            schema: { type: string } }
      responses:
        "200":
          description: The document
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doc" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/manifests:
    get:
      operationId: getManifests
      summary: The repository's package manifests, the technology they state and its internal dependencies
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The manifests
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifests" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "404": { $ref: "#/components/responses/NotFound" }
  /repos/{owner}/{name}/history:
    get:
      operationId: getHistory
      summary: The repository's stored history in graph order, one page at a time
      description: |
        The default branch (its latest 500 commits) and the commits of up to 10 other branches, newest first by commit time with a
        parent never before its child. `ref` keeps the commits reachable from a branch or tag; `author`, `q` and `automation=false`
        filter further and mark the page `filtered`, which draws no graph. Pages are numbered from 1, `limit` commits each; `at`
        (a SHA or its prefix) answers the page holding that commit instead of `page`, and names it in `at`. Each commit of an
        unfiltered page carries its row of the git graph, laid out over the whole history (or what `ref` reaches), so every page
        draws on from the one before.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: ref, in: query, required: false, description: A branch or tag of the history, schema: { type: string } }
        - { name: author, in: query, required: false, description: Login or name, case-insensitive, schema: { type: string } }
        - { name: q, in: query, required: false, description: "Text in the subject or body, or a SHA prefix", schema: { type: string, maxLength: 200 } }
        - { name: automation, in: query, required: false, description: "false leaves out commits made by automation", schema: { type: boolean, default: true } }
        - { $ref: "#/components/parameters/PageNumber" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: at, in: query, required: false, description: "A SHA or a prefix of at least 4 hex digits: the page holding it", schema: { type: string, pattern: "^[0-9a-fA-F]{4,40}$" } }
      responses:
        "200":
          description: One page of the history
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "308": { $ref: "#/components/responses/Moved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pages/{page}:
    get:
      operationId: getPage
      summary: A page's layout, its elements resolved against the viewer's view
      description: |
        The elements an admin arranged in the design mode (design/layout.md), or the built-in layout when none is stored. Groups the
        viewer cannot see, or that have no repository the viewer can see, are left out; an element whose groups are all left out is
        left out.
      parameters:
        - { name: page, in: path, required: true, schema: { type: string, enum: [dashboard] } }
      responses:
        "200":
          description: The page's layout
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageLayout" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
  /snapshot:
    get:
      operationId: getSnapshot
      summary: Data health; the web UI reads it to learn about new data
      responses:
        "200":
          description: The current snapshot
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInfo" }
        "304": { $ref: "#/components/responses/NotModified" }
  /me:
    get:
      operationId: getMe
      summary: The viewer, its roles and how one signs in
      description: |
        Who the request comes from, as the trusted proxy, the session or a bearer token names it, and what that admits: private
        repositories, the admin surfaces. `signIn` says which ways of signing in the portal offers. Never cached by a shared cache.
      responses:
        "200":
          description: The viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /assistant:
    get:
      operationId: getAssistant
      summary: Whether the assistant is on and the viewer may ask it
      responses:
        "200":
          description: The assistant's state for this viewer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
  /assistant/chat:
    post:
      operationId: chatAssistant
      summary: Ask the assistant; the answer streams as server-sent events
      description: |
        The conversation so far, oldest first, ending with the viewer's question. The answer is a `text/event-stream` of `text`
        (`{"text"}`, a piece of the answer), `tool` (`{"name", "label"}`, a lookup it makes), then `done` (`{"usage": {"input",
        "output"}}`) or `error` (`{"code", "message"}`), with a comment line every 15 s. The assistant only reads the catalogue, as the
        viewer sees it. A cookie-carrying request must come from the portal's own pages. Served outside the generated handlers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantChat" }
      responses:
        "200":
          description: The answer as an event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent events announcing every new snapshot
      description: |
        A `text/event-stream` that sends `event: snapshot` with the SnapshotInfo of the caller's view when it opens and whenever a
        snapshot with another version is published, a comment line every 25 s and `retry: 5000`. Served outside the generated
        handlers; at most 1,000 streams per instance.
      responses:
        "200":
          description: The event stream; each event's data is a SnapshotInfo
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          description: Too many streams; poll /snapshot instead
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  parameters:
    PageNumber:
      name: page
      in: query
      required: false
      description: The page, from 1
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
  headers:
    ETag:
      description: Weak validator of the response body
      schema: { type: string }
  responses:
    NotModified:
      description: The representation matches If-None-Match
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Moved:
      description: The repository was renamed or transferred
      headers:
        Location:
          required: true
          schema: { type: string }
    BadRequest:
      description: The parameters are not valid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Problem:
      description: A problem (its code says which)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Freshness:
      type: object
      required: [status, fetchedAt, checkedAt]
      properties:
        status: { type: string, enum: [fresh, stale, unknown, error] }
        fetchedAt: { type: [string, "null"], format: date-time, description: Last time the content was read }
        checkedAt: { type: [string, "null"], format: date-time, description: Last time the content was confirmed }
    Repo:
      type: object
      required: [address, owner, name, description, htmlUrl, homepage, defaultBranch, license, visibility, topics, archived, fork,
                 stars, openIssues, pushedAt, lastCommitAt, lastAuthoredAt, release, language, groups, health, freshness]
      properties:
        address: { type: string, description: "Lower-case owner/name, used in URLs" }
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        htmlUrl: { type: string }
        homepage: { type: string, description: Empty when not set }
        defaultBranch: { type: string }
        license: { type: string, description: SPDX id; empty when unknown }
        visibility: { type: string }
        topics: { type: array, items: { type: string } }
        archived: { type: boolean }
        fork: { type: boolean }
        stars: { type: integer }
        openIssues: { type: integer, description: Open issues and pull requests }
        pushedAt: { type: string, format: date-time }
        lastCommitAt: { type: [string, "null"], format: date-time, description: The newest default-branch commit; null until read }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "The newest default-branch commit by a person, not automation (bots, release plugins); when every read commit is automated, the oldest read one (the person's is older); null until read" }
        release: { oneOf: [{ $ref: "#/components/schemas/Release" }, { type: "null" }], description: The latest release; null when there is none or it is not read yet }
        language: { type: string, description: Language of the first package manifest; empty when there is none }
        groups: { type: array, items: { type: string }, description: Group ids in configuration order }
        health: { oneOf: [{ $ref: "#/components/schemas/Health" }, { type: "null" }], description: Null for an archived or deprecated repository }
        freshness: { $ref: "#/components/schemas/Freshness" }
    HealthLevel: { type: string, enum: [good, watch, attention], description: "good from 80, watch from 50, attention below" }
    Finding:
      type: object
      required: [code, penalty, message]
      properties:
        code: { type: string, enum: [failing, dormant, quiet, unreleased, no-licence, issues] }
        penalty: { type: integer, description: Points the finding costs }
        message: { type: string }
    Health:
      type: object
      required: [score, level, findings]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { $ref: "#/components/schemas/HealthLevel" }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
    RepoFinding:
      allOf:
        - $ref: "#/components/schemas/Finding"
        - type: object
          required: [repo]
          properties:
            repo: { type: string, description: Address of the repository }
    ProductHealth:
      type: object
      description: The weighted health of a group's repositories; archived and deprecated ones are not counted
      required: [score, level, counted, attention, watch, findings, findingCount]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        level: { $ref: "#/components/schemas/HealthLevel" }
        counted: { type: integer, description: Repositories with a score }
        attention: { type: integer, description: Repositories at attention }
        watch: { type: integer, description: Repositories at watch }
        findings: { type: array, items: { $ref: "#/components/schemas/RepoFinding" }, description: "Most costly first; the dashboard carries the first 5" }
        findingCount: { type: integer }
    Release:
      type: object
      required: [tag, url, publishedAt]
      properties:
        tag: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
    RepoDetail:
      type: object
      required: [repo, title, group, descriptor, commits, commitsFreshness]
      properties:
        repo: { $ref: "#/components/schemas/Repo" }
        group:
          oneOf: [{ $ref: "#/components/schemas/GroupRef" }, { type: "null" }]
          description: The first of its groups in configuration order, the page above it; null when it is in none
        title: { type: string, description: The descriptor title, else the repository name }
        descriptor: { $ref: "#/components/schemas/Descriptor" }
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: The latest default-branch commits }
        commitsFreshness: { $ref: "#/components/schemas/Freshness" }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Descriptor:
      type: object
      description: The repository's own scp.yaml. It changes display only.
      required: [present, file, title, description, lifecycle, owners, tags, links, problems, freshness]
      properties:
        present: { type: boolean }
        file: { type: string, description: Path of the file read; empty when none }
        title: { type: string }
        description: { type: string }
        lifecycle: { type: string, enum: ["", experimental, production, deprecated] }
        owners: { type: array, items: { type: string }, description: Claimed owners, "@user or @org/team" }
        tags: { type: array, items: { type: string } }
        links: { type: array, items: { $ref: "#/components/schemas/Link" } }
        problems: { type: array, items: { $ref: "#/components/schemas/FileProblem" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Link:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
    FileProblem:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: "JSON pointer into the file, /line/12 for a line; empty for the whole file" }
        code: { type: string }
        message: { type: string }
    Commit:
      type: object
      required: [repo, sha, subject, authorName, authorLogin, url, committedAt, parents, kind, assistant]
      properties:
        repo: { type: string, description: Repository address }
        sha: { type: string }
        subject: { type: string, description: First line of the message }
        authorName: { type: string }
        authorLogin: { type: string, description: GitHub login; empty when unknown }
        url: { type: string, description: Commit page; empty when unknown }
        committedAt: { type: string, format: date-time }
        parents:
          type: array
          items: { type: string }
          maxItems: 8
          description: SHAs of the parent commits, first parent first; empty for a root commit, two or more for a merge
        kind:
          type: string
          enum: [person, assisted, agent, automation]
          description: >-
            Who made it: a person with no trace of an AI; a person with an AI co-author (a Co-authored-by trailer or an AI tool's
            footer); a coding agent as the author; automation (CI, dependency and release bots, or a bot's pull request merged)
        assistant: { type: string, description: "The AI named by the commit, as named (\"Claude Opus 5\", \"Copilot\"); empty for none" }
    Label:
      type: object
      required: [name, kind, sha, default]
      properties:
        name: { type: string }
        kind: { type: string, enum: [branch, tag] }
        sha: { type: string, description: The commit it points at }
        default: { type: boolean, description: The default branch }
    HistoryCommit:
      allOf:
        - $ref: "#/components/schemas/Commit"
        - type: object
          required: [body, committerName, automated, labels, beyond, graph]
          properties:
            body: { type: string, description: The message after its subject line; empty when there is none }
            committerName: { type: string }
            automated: { type: boolean, description: "Made by automation: kind automation" }
            labels: { type: array, items: { $ref: "#/components/schemas/Label" }, description: "The branches and tags at this commit, the default branch first" }
            beyond: { type: array, items: { type: string }, description: The parents older than the stored history }
            graph: { oneOf: [{ $ref: "#/components/schemas/GraphRow" }, { type: "null" }], description: "The commit's row of the git graph; null on a filtered page" }
    GraphEdge:
      type: object
      description: A line through a row, from a lane at its top (or its node) to a lane at its bottom (or its node)
      required: [from, to, color, open]
      properties:
        from: { type: integer }
        to: { type: integer }
        color: { type: integer, description: "The lane's colour, 0 to 5" }
        open: { type: boolean, description: The line leads to a parent older than the stored history }
    GraphRow:
      type: object
      description: "How a commit's row of the git graph draws, like git log --graph: its node, the lines in from above and out below. Lanes never shift; draw at most 8, a lane beyond them in the last"
      required: [lane, color, merge, above, below]
      properties:
        lane: { type: integer }
        color: { type: integer, description: "0 to 5" }
        merge: { type: boolean }
        above: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        below: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
    HistoryPage:
      type: object
      required: [commits, labels, filtered, lanes, at, page, freshness]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/HistoryCommit" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" }, description: Every branch and tag of the history }
        filtered: { type: boolean, description: "author, q or automation left commits out: the page is a list, not a graph" }
        lanes: { type: integer, description: "The graph's width over this page's rows, at most 8; 0 on a filtered page" }
        at: { type: [string, "null"], description: "The commit `at` named, when it is on this page" }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    CommitPage:
      type: object
      required: [commits, page, freshness]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        page: { $ref: "#/components/schemas/Page" }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Page:
      type: object
      required: [number, size, total, pages]
      properties:
        number: { type: integer, description: This page, from 1 }
        size: { type: integer, description: Items per page (the limit) }
        total: { type: integer, description: Items matching the filter }
        pages: { type: integer, description: "Pages in all, at least 1" }
    FreshnessCounts:
      type: object
      description: Repositories by the freshness of their commits
      required: [fresh, stale, unknown, error]
      properties:
        fresh: { type: integer }
        stale: { type: integer }
        unknown: { type: integer }
        error: { type: integer }
    DashboardGroup:
      type: object
      required: [id, name, description, defaultRepo, repoCount, lastActivity, health, activity, members, summary]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"], description: Address of the group's main repository, whose badges the dashboard shows }
        repoCount: { type: integer }
        lastActivity: { type: [string, "null"], format: date-time, description: Time of the group's newest commit }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: Null when no repository is counted }
        activity: { $ref: "#/components/schemas/Activity" }
        members: { type: array, items: { $ref: "#/components/schemas/DashboardMember" }, description: "Every member, by address, for the fleet map" }
        summary: { $ref: "#/components/schemas/GroupSummaryFacts" }
    Activity:
      type: object
      description: >-
        Work on the default branches. A person's commit is one not made by automation (CI, dependency and release bots) and not part
        of a sweep: a subject that landed in more than 10 repositories on one day (UTC). A coding agent's commit is a person's: someone
        set the agent to it. Automation and sweeps are counted beside it, never in it; the commits with an AI (assisted or by an agent)
        within it. AI use leaves no trace in some tools (inline completion), so ai is a lower bound.
      required: [people, ai, automation, sweeps, weekly, weeklyAi, authors, authorCount, assistants, lastAuthoredAt, recent]
      properties:
        people: { type: integer, description: Commits by people in the last 30 days }
        ai: { type: integer, description: "Of the commits by people in the last 30 days, those with an AI: an AI co-author, or a coding agent as the author" }
        automation: { type: integer, description: Commits by automation in the last 30 days }
        sweeps: { type: integer, description: Commits of sweeps in the last 30 days }
        weekly: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: "Commits by people per 7 days, the oldest of the last 12 first" }
        weeklyAi: { type: array, items: { type: integer }, minItems: 12, maxItems: 12, description: "Of weekly, the commits with an AI" }
        assistants: { type: array, items: { type: string }, description: "The AI assistants of the last 30 days by family (\"Claude\", \"Copilot\"), most commits first, at most 3" }
        authors: { type: array, items: { $ref: "#/components/schemas/Person" }, description: "The people who committed in the last 30 days, most commits first, at most 5" }
        authorCount: { type: integer, description: How many people committed in the last 30 days }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "The newest commit by a person; null when none is read" }
        recent: { type: array, items: { $ref: "#/components/schemas/RecentRepo" }, description: "The repositories people changed last, at most 3" }
    Person:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "The name in the commits (the login when they carry none)" }
        login: { type: string, description: "The GitHub login, when GitHub links the commits to an account; the short form to show" }
    RecentRepo:
      type: object
      required: [repo, at]
      properties:
        repo: { type: string, description: Address }
        at: { type: string, format: date-time }
    DashboardMember:
      type: object
      required: [address, name, archived, lastAuthoredAt, level]
      properties:
        address: { type: string }
        name: { type: string }
        archived: { type: boolean }
        lastAuthoredAt: { type: [string, "null"], format: date-time, description: "As Repo.lastAuthoredAt" }
        level: { oneOf: [{ $ref: "#/components/schemas/HealthLevel" }, { type: "null" }], description: Null when not counted }
    GroupSummaryFacts:
      type: object
      description: What most members share, said once instead of on every repository; null where fewer than 80% share it
      required: [license, language, released]
      properties:
        license: { type: [string, "null"], description: "The licence at least 80% of the members have" }
        language: { type: [string, "null"], description: "The language at least 80% of the members have" }
        released: { type: integer, description: Members with a release }
    LayoutElement:
      type: object
      description: >-
        One block of a page. Each kind reads only its own fields: products and fleet-map take groups (absent: every group), products
        takes view, latest-commits takes count, heading takes text and note (plain text).
      required: [kind]
      properties:
        kind: { type: string, enum: [telemetry, fleet-map, products, latest-commits, heading] }
        groups: { type: array, items: { type: string }, minItems: 1, maxItems: 100, description: Group ids in display order }
        view: { type: string, enum: [cards, table], description: "How products are drawn until the reader switches" }
        count: { type: integer, minimum: 1, maximum: 50, description: How many commits }
        text: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 500 }
    PageLayout:
      type: object
      required: [page, elements, stored]
      properties:
        page: { type: string }
        elements: { type: array, items: { $ref: "#/components/schemas/LayoutElement" } }
        stored: { type: boolean, description: "An admin's layout; false: the built-in one" }
    Dashboard:
      type: object
      required: [groups, repoCount, ungroupedCount, latest, health, freshness, activity]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/DashboardGroup" } }
        activity: { $ref: "#/components/schemas/Activity" }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: "Every repository weighed as one product; the first 5 findings" }
        repoCount: { type: integer }
        ungroupedCount: { type: integer, description: Repositories in no group }
        latest: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: "The 10 newest commits by people (Activity): neither automation nor sweeps; /commits lists all of them" }
        freshness: { $ref: "#/components/schemas/FreshnessCounts" }
    DocSummary:
      type: object
      required: [id, path, readme, title, description, format, state, truncated]
      properties:
        id: { type: string, description: Path parameter of the document }
        path: { type: string }
        readme: { type: boolean }
        title: { type: string }
        description: { type: string }
        format: { type: string, enum: [markdown, text] }
        state: { type: string, enum: [ok, too_large, unsupported], description: too_large and unsupported have no HTML }
        truncated: { type: boolean, description: Only the first part of the file is rendered }
    DocList:
      type: object
      required: [docs, freshness]
      properties:
        docs: { type: array, items: { $ref: "#/components/schemas/DocSummary" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Heading:
      type: object
      required: [level, id, text]
      properties:
        level: { type: integer, minimum: 2, maximum: 3 }
        id: { type: string }
        text: { type: string }
    Doc:
      type: object
      required: [id, path, readme, title, description, format, state, truncated, html, toc, blobSha, sourceUrl, freshness]
      properties:
        id: { type: string }
        path: { type: string }
        readme: { type: boolean }
        title: { type: string }
        description: { type: string }
        format: { type: string, enum: [markdown, text] }
        state: { type: string, enum: [ok, too_large, unsupported] }
        truncated: { type: boolean }
        html: { type: string, description: Sanitised HTML }
        toc: { type: array, items: { $ref: "#/components/schemas/Heading" } }
        blobSha: { type: string }
        sourceUrl: { type: string, description: The file on GitHub }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Manifests:
      type: object
      required: [technology, manifests, uses, usedBy, freshness]
      properties:
        technology: { $ref: "#/components/schemas/Technology" }
        manifests: { type: array, items: { $ref: "#/components/schemas/Manifest" }, description: By path }
        uses: { type: array, items: { $ref: "#/components/schemas/RepoLink" }, description: Catalogued repositories this one depends on }
        usedBy: { type: array, items: { $ref: "#/components/schemas/RepoLink" }, description: Catalogued repositories that depend on this one }
        freshness: { $ref: "#/components/schemas/Freshness" }
    Technology:
      type: object
      required: [languages, buildTools, toolchains]
      properties:
        languages: { type: array, items: { type: string } }
        buildTools: { type: array, items: { type: string } }
        toolchains: { type: array, items: { $ref: "#/components/schemas/ToolchainVersions" } }
    ToolchainVersions:
      type: object
      required: [name, versions]
      properties:
        name: { type: string, enum: [go, node, java] }
        versions: { type: array, items: { type: string }, description: Every version the manifests state }
    Manifest:
      type: object
      required: [path, ecosystem, name, version, language, buildTool, toolchain, dependencies, problems]
      properties:
        path: { type: string }
        ecosystem: { type: string, enum: [go, npm, maven] }
        name: { type: string, description: "Go module path, npm package name or Maven groupId:artifactId; empty when the file names none" }
        version: { type: string }
        language: { type: string }
        buildTool: { type: string }
        toolchain: { type: array, items: { $ref: "#/components/schemas/Toolchain" } }
        dependencies: { type: array, items: { $ref: "#/components/schemas/Dependency" } }
        problems: { type: array, items: { $ref: "#/components/schemas/FileProblem" } }
    Toolchain:
      type: object
      required: [name, version]
      properties:
        name: { type: string, enum: [go, node, java] }
        version: { type: string }
    Dependency:
      type: object
      required: [name, version, scope, repos]
      properties:
        name: { type: string }
        version: { type: string, description: The requirement as written; empty when none }
        scope: { type: string, enum: [runtime, dev, peer, optional, provided, test, indirect, tool, parent, import] }
        repos: { type: array, items: { type: string }, description: Addresses of the catalogued repositories that declare this name }
    RepoLink:
      type: object
      required: [address, owner, name, via]
      properties:
        address: { type: string }
        owner: { type: string }
        name: { type: string }
        via: { type: array, items: { type: string }, description: The dependency names that link the two repositories }
    RepoList:
      type: object
      required: [repos]
      properties:
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
    GroupSummary:
      type: object
      required: [id, name, description, defaultRepo, defaultRepoState, repoCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"], description: Address of the group's main repository }
        defaultRepoState: { type: string, enum: [ok, missing] }
        repoCount: { type: integer }
    GroupList:
      type: object
      required: [groups]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/GroupSummary" } }
    Group:
      type: object
      required: [id, name, description, defaultRepo, defaultRepoState, repoCount, health, repos]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        defaultRepo: { type: [string, "null"] }
        defaultRepoState: { type: string, enum: [ok, missing] }
        repoCount: { type: integer }
        health: { oneOf: [{ $ref: "#/components/schemas/ProductHealth" }, { type: "null" }], description: Every finding }
        repos: { type: array, items: { $ref: "#/components/schemas/Repo" } }
    SourceInfo:
      type: object
      required: [id, repos, freshness]
      properties:
        id: { type: string }
        repos: { type: integer }
        freshness: { $ref: "#/components/schemas/Freshness" }
    AssistantStatus:
      type: object
      additionalProperties: false
      required: [enabled, allowed, access, provider, model]
      properties:
        enabled: { type: boolean, description: The operator configured a provider }
        allowed: { type: boolean, description: This viewer may ask }
        access: { type: string, enum: [signed-in, admin, everyone], description: Who may ask }
        provider: { type: string, description: The provider; empty when off }
        model: { type: string, description: The model; empty when off }
    AssistantChat:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
    Me:
      type: object
      required: [signedIn, name, via, private, admin, signIn]
      properties:
        signedIn: { type: boolean }
        name: { type: string, description: "The viewer's name; empty when anonymous" }
        via: { type: string, enum: [none, proxy, oidc, token], description: "How the viewer is identified; none when anonymous" }
        private: { type: boolean, description: Sees private and internal repositories }
        admin: { type: boolean, description: Sees the operator surfaces }
        signIn:
          type: object
          required: [oidc, token]
          properties:
            oidc: { type: boolean, description: "GET /auth/login signs in at the provider" }
            token: { type: boolean, description: "POST /auth/token exchanges a token for a session" }
    SnapshotInfo:
      type: object
      required: [version, builtAt, ready, sources]
      properties:
        version:
          type: integer
          format: int64
          description: Identifies the content; equal on every instance for equal data. Compare for equality only.
        builtAt: { type: [string, "null"], format: date-time }
        ready: { type: boolean, description: A catalogue is loaded }
        sources: { type: array, items: { $ref: "#/components/schemas/SourceInfo" } }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: "urn:scp:request:<request id>" }
        code: { type: string }
