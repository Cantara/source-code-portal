# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release v2 (release.yml on tags v*): one CGO-free binary per platform and the platform-independent web bundle (release.yml builds
# web/bundle first) as scp-web_<version>.tar.gz, archives with sha256 checksums signed keyless by cosign, and one multi-platform image
# around those binaries and the bundle (deploy/Dockerfile.release),
# signed by digest and carrying a BuildKit SBOM. Full releases also move :latest.
version: 2
project_name: scp

before:
  hooks:
    - test -s web/bundle/server.js # a release without the built web UI serves no pages
    - tar --sort=name --mtime=@{{ .CommitTimestamp }} --owner=0 --group=0 --numeric-owner -czf scp-web.tar.gz -C web bundle

builds:
  - id: scp
    main: ./cmd/scp
    binary: scp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.build={{ .FullCommit }}"
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - { goos: darwin, goarch: amd64 }

archives:
  - id: scp
    formats: [tar.gz]
    name_template: "scp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, deploy/config.example.yaml]

checksum:
  name_template: "scp_{{ .Version }}_checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: scp-web.tar.gz
      name_template: "scp-web_{{ .Version }}.tar.gz"

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

dockers_v2:
  - id: image
    ids: [scp]
    dockerfile: deploy/Dockerfile.release
    images: [ghcr.io/cantara/source-code-portal]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    extra_files: [web/bundle]
    build_args:
      VERSION: "{{ .Version }}"
      BUILD_ID: "{{ .FullCommit }}"
    annotations:
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

docker_signs:
  - id: image
    cmd: cosign
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

release:
  prerelease: auto
  extra_files:
    - glob: scp-web.tar.gz
      name_template: "scp-web_{{ .Version }}.tar.gz"
  name_template: "v{{ .Version }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^chore\\(deps\\)", "^docs?(\\(.*\\))?:", "^test(\\(.*\\))?:", "^ci(\\(.*\\))?:"]
